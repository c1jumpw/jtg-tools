<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>ContentFlow</title>
<meta name="description" content="Content strategy production board, synced live with ClickUp." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23142A2E%22/><path d=%22M28 62 L46 40 L58 52 L74 30%22 stroke=%22%23E8A23D%22 stroke-width=%228%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   DESIGN TOKENS
   A production-desk look: deep teal-ink shell, amber "in progress" accent,
   warm paper background. Stage colors on cards/columns are NOT hardcoded here
   -- they're read live from each ClickUp status's own color (see statusColor()
   in the script below), so the app always matches whatever stages/colors are
   configured in ClickUp, no code change needed if those are edited later.
   ============================================================================ */
:root {
  --ink: #14232b;
  --paper: #fbfaf7;
  --paper-dim: #f1eee6;
  --accent: #e8a23d;
  --accent-dim: #f6d9a8;
  --text: #1b2430;
  --text-secondary: #5b6670;
  --text-faint: #92999f;
  --border: #e2dfd5;
  --border-strong: #cfc9ba;
  --danger: #c9463c;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 2px rgba(20, 35, 43, 0.06), 0 1px 1px rgba(20, 35, 43, 0.04);
  --shadow-pop: 0 12px 32px rgba(20, 35, 43, 0.18);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app-shell { min-height: 100%; display: flex; flex-direction: column; }
.topnav { background: var(--ink); color: #eef2f2; display: flex; align-items: center; gap: 20px; padding: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: 0.2px; margin-right: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.brand-mark svg { width: 14px; height: 14px; }
.view-tabs { display: flex; gap: 2px; background: rgba(255,255,255,0.06); padding: 3px; border-radius: 9px; }
.view-tab { padding: 7px 14px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: rgba(238,242,242,0.65); transition: background 0.15s, color 0.15s; }
.view-tab:hover { color: #fff; }
.view-tab.active { background: var(--paper); color: var(--ink); }
.topnav-spacer { flex: 1; }
.topnav-right { display: flex; align-items: center; gap: 10px; }
.account-filter select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #eef2f2; padding: 7px 10px; border-radius: 7px; font-size: 13px; }
.icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: rgba(238,242,242,0.75); transition: background 0.15s, color 0.15s; }
.icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13.5px; transition: transform 0.1s, filter 0.15s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #21160a; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: rgba(255,255,255,0.08); color: #eef2f2; }
.btn-ghost:hover { background: rgba(255,255,255,0.16); }
.btn-outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
.btn-outline:hover { background: var(--paper-dim); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(201,70,60,0.35); }
.btn-danger:hover { background: rgba(201,70,60,0.08); }
.btn-sm { padding: 6px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.main { flex: 1; padding: 18px 20px 40px; max-width: 1600px; width: 100%; margin: 0 auto; }
.status-banner { display: flex; align-items: center; gap: 10px; background: #fff3e2; border: 1px solid var(--accent-dim); color: #6b4a12; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13.5px; margin-bottom: 16px; }
.status-banner.error { background: #fdecea; border-color: #f3c6c1; color: #8a2a22; }
.board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.board-column { flex: 0 0 268px; background: var(--paper-dim); border-radius: var(--radius-lg); padding: 10px; min-height: 120px; }
.board-column.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.board-column-header { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.board-column-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-secondary); }
.board-column-count { margin-left: auto; font-size: 12px; color: var(--text-faint); background: rgba(0,0,0,0.05); padding: 1px 7px; border-radius: 10px; }
.card { background: #fff; border-radius: var(--radius-md); padding: 12px 12px 10px; margin-bottom: 8px; box-shadow: var(--shadow-card); border: 1px solid var(--border); cursor: grab; transition: box-shadow 0.15s, transform 0.15s; }
.card:hover { box-shadow: 0 6px 18px rgba(20,35,43,0.12); transform: translateY(-1px); }
.card:active { cursor: grabbing; }
.card-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; margin-bottom: 8px; }
.card-meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.chip { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px; color: #fff; white-space: nowrap; }
.chip-outline { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--border-strong); color: var(--text-secondary); background: var(--paper); }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.card-id { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); }
.avatar-stack { display: flex; }
.avatar { width: 21px; height: 21px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; color: #fff; border: 1.5px solid #fff; margin-left: -6px; }
.avatar:first-child { margin-left: 0; }
.add-card-btn { width: 100%; text-align: left; padding: 8px 10px; color: var(--text-faint); font-size: 12.5px; border-radius: var(--radius-sm); }
.add-card-btn:hover { background: rgba(0,0,0,0.04); color: var(--text-secondary); }
.table-wrap { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; overflow-x: auto; }
table.list-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
.list-table thead th { text-align: left; padding: 10px 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-faint); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
.list-table thead th:hover { color: var(--text-secondary); }
.list-table tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
.list-table tbody tr:hover { background: var(--paper-dim); }
.list-table tbody tr:last-child { border-bottom: none; }
.list-table td { padding: 11px 14px; vertical-align: middle; }
.list-table .task-name-cell { font-weight: 600; max-width: 320px; }
.muted { color: var(--text-faint); }
.calendar-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.calendar-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.calendar-dow { background: var(--paper-dim); padding: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-faint); text-align: center; }
.calendar-cell { background: #fff; min-height: 96px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.calendar-cell.outside { background: #fafafa; }
.calendar-daynum { font-size: 11.5px; color: var(--text-faint); font-weight: 600; }
.calendar-daynum.today { color: var(--accent); }
.cal-item { font-size: 10.5px; padding: 2px 6px; border-radius: 5px; color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.modal-overlay { position: fixed; inset: 0; background: rgba(20,35,43,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow-y: auto; z-index: 50; }
.modal { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 720px; box-shadow: var(--shadow-pop); margin-bottom: 4vh; }
.modal-header { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 14px; border-bottom: 1px solid var(--border); }
.modal-header input.title-input { font-family: var(--font-display); font-size: 20px; font-weight: 600; border: none; width: 100%; padding: 4px 0; background: transparent; }
.modal-body { padding: 18px 22px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
.field-group { display: flex; flex-direction: column; gap: 5px; }
.field-group.full { grid-column: 1 / -1; }
.field-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-faint); }
.field-input, .field-select { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13.5px; background: var(--paper); width: 100%; }
.field-input:focus, .field-select:focus, .title-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.medium-toggle-group { display: flex; flex-wrap: wrap; gap: 6px; }
.medium-toggle { font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-secondary); background: #fff; }
.medium-toggle.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.assignee-row { display: flex; flex-wrap: wrap; gap: 6px; }
.assignee-pill { display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; border-radius: 999px; border: 1px solid var(--border-strong); font-size: 12px; font-weight: 600; background: #fff; }
.assignee-pill.active { background: var(--paper-dim); border-color: var(--ink); }
.comments-section { border-top: 1px solid var(--border); padding: 16px 22px 20px; }
.comment { display: flex; gap: 10px; margin-bottom: 12px; }
.comment-body { background: var(--paper-dim); border-radius: var(--radius-md); padding: 8px 12px; font-size: 13px; flex: 1; }
.comment-author { font-weight: 700; font-size: 12px; margin-bottom: 2px; }
.comment-form { display: flex; gap: 8px; margin-top: 10px; }
.comment-form textarea { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; resize: vertical; min-height: 38px; font-size: 13px; }
.modal-footer { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; border-top: 1px solid var(--border); }
.connect-screen { min-height: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 20% 15%, #1c333c 0%, var(--ink) 55%, #0f1c22 100%); padding: 24px; }
.connect-card { background: var(--paper); border-radius: var(--radius-lg); padding: 36px 34px; max-width: 460px; width: 100%; box-shadow: var(--shadow-pop); }
.connect-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.connect-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin: 0 0 4px; }
.connect-sub { color: var(--text-secondary); font-size: 13.5px; margin: 0 0 22px; line-height: 1.5; }
.connect-form { display: flex; flex-direction: column; gap: 14px; }
.connect-form label { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 5px; }
.connect-form input { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13.5px; }
.remember-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-secondary); }
.connect-help { font-size: 12px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }
.connect-help a { color: var(--accent); font-weight: 600; text-decoration: none; }
.connect-help a:hover { text-decoration: underline; }
.center-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 12px; color: var(--text-secondary); font-size: 13.5px; }
.spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-faint); }
.empty-state h3 { font-family: var(--font-display); font-size: 18px; color: var(--text); margin-bottom: 6px; }
@media (max-width: 760px) {
  .topnav { padding: 10px 14px; }
  .view-tab { padding: 7px 10px; font-size: 12.5px; }
  .main { padding: 14px 12px 30px; }
  .modal-body { grid-template-columns: 1fr; }
  .calendar-cell { min-height: 68px; }
}
</style>
</head>
<body>
<div id="app"><!-- Rendered entirely by JS below; see render(). --></div>

<script>
'use strict';
/* ============================================================================
   CONTENTFLOW -- Content Strategy Production Board
   ----------------------------------------------------------------------------
   PURPOSE
     A ClickUp-backed content production board mirroring the "Client Master
     Content Strategy Workflow" list: Board / List / Calendar views, custom
     fields, assignees, and comments, filterable by client account.

   ARCHITECTURE
     - Zero build step: plain HTML + CSS + vanilla JS in one file, matching the
       convention already used elsewhere in this jtg-tools repo (mkc-crm,
       keyforge, brand-kit-generator, ...). GitHub Pages serves this file
       as-is -- no npm, no bundler, no CI required.
     - No backend/database of its own. Every read and write goes straight to
       the ClickUp REST API (v2) using the user's own personal API token,
       entered once via the connect screen. Nothing about task *content* is
       ever stored outside ClickUp -- only the token + list ID are cached in
       this browser (localStorage if "remember" is checked, else
       sessionStorage), purely so the user doesn't have to retype them every
       visit. See "SECURITY NOTE" further down for the honest tradeoffs here.
     - Rendering model: one mutable `state` object + a `render()` function
       that rebuilds the DOM from a template string on structural changes
       (view switch, data load, opening/closing the task modal, drag-and-drop,
       etc). Free-typing inputs (task name, custom text fields, new comment
       box) do NOT trigger render() on every keystroke -- they just write into
       `state.taskDraft` / `state.newCommentText` -- otherwise re-rendering
       mid-keystroke would reset the text cursor. Each event handler below is
       labelled RENDER or NO-RENDER to make this distinction explicit.

   KEY DATA FLOWS
     1. Connect screen -> validate token via GET /user -> cache creds -> loadAll()
     2. loadAll() -> parallel fetch of list metadata, custom field defs, list
        members, and tasks -> populates `state` -> render()
     3. Board drag-and-drop / status dropdown -> optimistic local update ->
        PUT /task/{id} {status} -> on failure, roll back via loadAll()
     4. Task modal save -> PUT/POST task (name/status/assignees) -> then one
        POST /task/{id}/field/{fieldId} call per changed custom field
     5. Comments -> GET/POST /task/{id}/comment, refetched after posting

   ASSUMPTIONS / EXTERNAL DEPENDENCIES
     - ClickUp API v2 (https://api.clickup.com/api/v2), authenticated via the
       `Authorization` header set to the raw personal token (NOT "Bearer " +
       token -- ClickUp's own API expects the bare token).
     - ClickUp allows direct authenticated requests from a browser origin --
       already proven out by this repo's other ClickUp-backed tool (mkc-crm).
       No CORS proxy is used or needed.
     - The ClickUp list is expected to have custom fields named exactly:
       "MKC ID", "Next Action Date", "Medium(s)", "Publish Date",
       "Related Account ID", "Scheduled Date". Any *other* custom fields on
       the list are still rendered generically in the task modal (see
       renderCustomFieldInput()) so the app doesn't need a code change if
       fields are added later in ClickUp.
     - Dates round-trip through ClickUp as unix-ms timestamps (numbers, sent
       as either a number or numeric string); see fromClickUpDate()/
       toClickUpDate().

   SECURITY NOTE (token handling)
     This is a static site with no server component, so there is no way to
     keep an API token truly secret from someone who has the page open and
     opens devtools. We deliberately do NOT hardcode a token in this file
     (unlike the pattern seen in mkc-crm/index.html in this same repo, which
     should be rotated/reviewed separately). Instead each user pastes their
     own personal token into the connect screen; it is cached only in *their*
     browser, never committed to source control.

   VERSION HISTORY
     v1.0.0 (2026-09-08) -- Initial vanilla-JS build for the jtg-tools repo
       (content-strategy-workflow/index.html), replacing an earlier
       React/Vite prototype that didn't match this repo's no-build-step
       convention. Board/List/Calendar views, custom fields, assignees,
       comments, drag-and-drop status changes.
   ============================================================================ */

  // ==========================================================================
  // CONFIG & CONSTANTS
  // ==========================================================================

  // Base URL for every ClickUp API v2 call.
  var CU_BASE = 'https://api.clickup.com/api/v2';

  // localStorage/sessionStorage key under which {token, listId} is cached.
  // NEVER store anything else here -- see SECURITY NOTE above.
  var STORAGE_KEY = 'contentflow.credentials';

  // The custom field ContentFlow treats as the "client account" dimension,
  // used to populate the account filter dropdown and the List view's
  // "Account" column. Must match the field's exact name in ClickUp.
  var ACCOUNT_FIELD_NAME = 'Related Account ID';

  // Small fixed palette used to derive a stable, distinct color per
  // person/string (e.g. assignee avatars) -- NOT related to ClickUp's own
  // status colors, which are read live from the API instead (see statusColor()).
  var AVATAR_PALETTE = ['#7B68EE', '#E0479E', '#3B82F6', '#22B8CF', '#2F9E44', '#F2994A', '#C9463C', '#8B8FA3'];

  // ==========================================================================
  // GLOBAL STATE
  // A single mutable object holding everything render() needs. Treated as a
  // simple in-memory store -- no framework, no reactivity system. Every
  // mutation is followed by an explicit render() call (except the NO-RENDER
  // input handlers noted above).
  // ==========================================================================
  var state = {
    creds: null,          // {token, listId} | null -- loaded from storage at boot
    listMeta: null,       // raw ClickUp GET /list/{id} response (name, statuses[], ...)
    fields: [],           // raw ClickUp GET /list/{id}/field response's .fields[]
    members: [],          // raw ClickUp GET /list/{id}/member response's .members[]
    tasks: [],            // raw ClickUp GET /list/{id}/task response's .tasks[]
    loading: false,       // true while loadAll() is in flight (drives the spinner)
    error: null,          // last user-facing error string, or null
    view: 'board',        // 'board' | 'list' | 'calendar' -- which main view is shown
    accountFilter: 'all', // 'all' or a specific Related-Account-ID value
    openTaskId: null,     // null (modal closed) | 'new' | an existing task's id
    taskDraft: null,      // working copy of the open task's editable fields (see openTaskModal())
    comments: [],         // comments for the currently-open existing task
    commentsLoading: false,
    newCommentText: '',   // NO-RENDER field bound to the comment textarea
    connectError: null,   // error shown on the connect screen specifically
    connecting: false,    // true while the connect-screen "Connect" call is in flight
    saving: false,        // true while the task modal's Save is in flight
    deleting: false,      // true while the task modal's Delete is in flight
  };

  // The single root element everything is rendered into.
  var root = document.getElementById('app');

  // ==========================================================================
  // UTILITIES
  // ==========================================================================

  /**
   * Escape a string for safe interpolation into innerHTML.
   * Every piece of ClickUp-sourced text (task names, comments, usernames,
   * custom field values) MUST be passed through this before being placed in
   * a template string, since it ultimately becomes raw HTML.
   * @param {*} str - value to escape (non-strings are coerced first)
   * @returns {string}
   */
  function esc(str) {
    var div = document.createElement('div');
    div.textContent = str === null || str === undefined ? '' : String(str);
    return div.innerHTML;
  }

  /**
   * Convert a ClickUp date value (unix ms, as a number or numeric string) to
   * a 'yyyy-mm-dd' string suitable for an <input type="date">.
   * @param {string|number|null} val
   * @returns {string} '' if val is falsy/unparseable
   */
  function fromClickUpDate(val) {
    if (!val) return '';
    var n = Number(val);
    if (!n) return '';
    var d = new Date(n);
    return d.toISOString().slice(0, 10);
  }

  /**
   * Convert a 'yyyy-mm-dd' <input type="date"> value back into a unix-ms
   * timestamp for sending to ClickUp.
   * @param {string} dateStr
   * @returns {number|null} null if dateStr is empty/invalid (clears the field)
   */
  function toClickUpDate(dateStr) {
    if (!dateStr) return null;
    var ms = new Date(dateStr + 'T00:00:00').getTime();
    return isNaN(ms) ? null : ms;
  }

  /** Human-friendly display of a 'yyyy-mm-dd' string, e.g. "Sep 8, 2026". */
  function formatDisplayDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  /** Deterministic color for a given string (e.g. a username), for avatars. */
  function colorForString(str) {
    str = str || '';
    var hash = 0;
    for (var i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
  }

  /** Up to two initials from a display name, for avatar badges. */
  function initials(name) {
    return (name || '')
      .split(' ')
      .filter(Boolean)
      .slice(0, 2)
      .map(function (w) { return w[0] ? w[0].toUpperCase() : ''; })
      .join('');
  }

  /** Ensure a ClickUp color string has its leading '#' (some responses omit it). */
  function hexColor(c) {
    if (!c) return '#8b8fa3'; // neutral gray-violet fallback when ClickUp gives no color
    return c.charAt(0) === '#' ? c : '#' + c;
  }

  /**
   * Find a custom field + its current value on a task by exact (case-
   * insensitive) field name.
   * @param {object} task - a ClickUp task object (has .custom_fields[])
   * @param {string} fieldName
   * @returns {{field: object|null, value: *}}
   */
  function getCustomFieldValue(task, fieldName) {
    var list = task.custom_fields || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].name.toLowerCase() === fieldName.toLowerCase()) {
        return { field: list[i], value: list[i].value };
      }
    }
    return { field: null, value: null };
  }

  /**
   * Resolve a "labels" (multi-select) custom field's raw value (an array of
   * option ids) into the full option objects {id, label, color}, using the
   * field definition's type_config.options as the lookup table.
   * @param {object|null} field - the field definition (from GET /list/field)
   * @param {*} value - the task's stored value for that field
   * @returns {Array<object>}
   */
  function labelsForDropdownField(field, value) {
    if (!field) return [];
    var options = (field.type_config && field.type_config.options) || [];
    if (!Array.isArray(value)) return [];
    return value
      .map(function (v) {
        for (var i = 0; i < options.length; i++) {
          if (options[i].id === v) return options[i];
        }
        return null;
      })
      .filter(Boolean);
  }

  /** Resolve a ClickUp status object's color, with a neutral fallback. */
  function statusColor(status) {
    return status && status.color ? hexColor(status.color) : '#5b6670';
  }

  // ==========================================================================
  // CREDENTIAL PERSISTENCE
  // Only {token, listId} ever gets written here -- see SECURITY NOTE at top.
  // ==========================================================================

  function loadCreds() {
    try {
      var local = localStorage.getItem(STORAGE_KEY);
      if (local) return JSON.parse(local);
    } catch (e) { /* storage disabled or corrupt -- fall through */ }
    try {
      var session = sessionStorage.getItem(STORAGE_KEY);
      if (session) return JSON.parse(session);
    } catch (e) { /* ignore */ }
    return null;
  }

  function saveCreds(creds, remember) {
    var payload = JSON.stringify(creds);
    if (remember) {
      localStorage.setItem(STORAGE_KEY, payload);
      sessionStorage.removeItem(STORAGE_KEY);
    } else {
      sessionStorage.setItem(STORAGE_KEY, payload);
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  function clearCreds() {
    localStorage.removeItem(STORAGE_KEY);
    sessionStorage.removeItem(STORAGE_KEY);
  }

  // ==========================================================================
  // CLICKUP API WRAPPER
  // Every network call to ClickUp funnels through cuRequest() so auth headers
  // and error handling stay in one place.
  // ==========================================================================

  /**
   * Low-level fetch wrapper for the ClickUp API.
   * @param {string} token - the user's personal API token (sent as-is, no "Bearer ")
   * @param {string} path - path relative to CU_BASE, e.g. '/list/123/task'
   * @param {object} [options] - standard fetch() options (method, body, ...)
   * @returns {Promise<object|null>} parsed JSON body, or null for 204 responses
   * @throws {Error} with a user-facing .message on network failure or non-2xx status
   */
  function cuRequest(token, path, options) {
    options = options || {};
    var headers = Object.assign({ Authorization: token, 'Content-Type': 'application/json' }, options.headers || {});
    return fetch(CU_BASE + path, Object.assign({}, options, { headers: headers }))
      .catch(function () {
        // Network-level failure (offline, DNS, or -- most likely in practice
        // for a brand-new setup -- a CORS rejection from the browser).
        throw new Error('Could not reach ClickUp. Check your connection, or that your browser/network isn\'t blocking requests to api.clickup.com.');
      })
      .then(function (res) {
        if (res.status === 204) return null;
        if (!res.ok) {
          if (res.status === 401) throw new Error('Your API token was rejected. Double-check it and reconnect.');
          return res.json().catch(function () { return {}; }).then(function (body) {
            throw new Error('ClickUp API error (' + res.status + '): ' + (body.err || res.statusText));
          });
        }
        return res.json();
      });
  }

  // Thin, named wrappers around cuRequest() for each endpoint ContentFlow uses.
  var clickup = {
    getUser: function (token) { return cuRequest(token, '/user'); },
    getList: function (token, listId) { return cuRequest(token, '/list/' + listId); },
    getListFields: function (token, listId) {
      return cuRequest(token, '/list/' + listId + '/field').then(function (r) { return r.fields || []; });
    },
    getListMembers: function (token, listId) {
      return cuRequest(token, '/list/' + listId + '/member').then(function (r) { return r.members || []; });
    },
    getTasks: function (token, listId) {
      // include_closed=true so "Published"/"Approved"-style closed statuses
      // still show up; subtasks=false keeps this list scoped to top-level
      // content entries (mirrors the ClickUp board's own default view).
      return cuRequest(token, '/list/' + listId + '/task?include_closed=true&subtasks=false&order_by=created&reverse=true')
        .then(function (r) { return r.tasks || []; });
    },
    createTask: function (token, listId, payload) {
      return cuRequest(token, '/list/' + listId + '/task', { method: 'POST', body: JSON.stringify(payload) });
    },
    updateTask: function (token, taskId, payload) {
      return cuRequest(token, '/task/' + taskId, { method: 'PUT', body: JSON.stringify(payload) });
    },
    deleteTask: function (token, taskId) {
      return cuRequest(token, '/task/' + taskId, { method: 'DELETE' });
    },
    setCustomField: function (token, taskId, fieldId, value) {
      return cuRequest(token, '/task/' + taskId + '/field/' + fieldId, { method: 'POST', body: JSON.stringify({ value: value }) });
    },
    getComments: function (token, taskId) {
      return cuRequest(token, '/task/' + taskId + '/comment').then(function (r) { return r.comments || []; });
    },
    postComment: function (token, taskId, commentText) {
      return cuRequest(token, '/task/' + taskId + '/comment', { method: 'POST', body: JSON.stringify({ comment_text: commentText }) });
    },
  };

  // ==========================================================================
  // DATA LOADING / MUTATIONS
  // ==========================================================================

  /**
   * Validate credentials against ClickUp, cache them, and trigger the first
   * full data load. Called from the connect screen's submit handler.
   * @param {string} token
   * @param {string} listId
   * @param {boolean} remember - persist across browser restarts (localStorage)
   *   vs. this tab session only (sessionStorage)
   */
  function connect(token, listId, remember) {
    state.connecting = true;
    state.connectError = null;
    render();
    clickup.getUser(token) // cheapest possible call that proves the token works
      .then(function () {
        var creds = { token: token, listId: listId };
        saveCreds(creds, remember);
        state.creds = creds;
        state.connecting = false;
        render();
        loadAll();
      })
      .catch(function (err) {
        state.connecting = false;
        state.connectError = err.message || 'Could not connect.';
        render();
      });
  }

  /** Clear cached credentials and return to the connect screen. */
  function disconnect() {
    clearCreds();
    state.creds = null;
    state.listMeta = null;
    state.tasks = [];
    state.fields = [];
    state.members = [];
    render();
  }

  /**
   * Fetch list metadata, custom field definitions, members, and tasks in
   * parallel, then re-render. This is the single source of truth refresh --
   * called on connect, on manual refresh, and after any save/delete/move so
   * the UI always reflects ClickUp's actual current state (rather than trying
   * to keep a fully independent local cache in sync by hand).
   */
  function loadAll() {
    if (!state.creds) return;
    state.loading = true;
    state.error = null;
    render();
    var token = state.creds.token, listId = state.creds.listId;
    Promise.all([
      clickup.getList(token, listId),
      clickup.getListFields(token, listId),
      clickup.getListMembers(token, listId),
      clickup.getTasks(token, listId),
    ])
      .then(function (results) {
        state.listMeta = results[0];
        state.fields = results[1];
        state.members = results[2];
        state.tasks = results[3];
      })
      .catch(function (err) {
        state.error = err.message || 'Something went wrong loading your list.';
      })
      .then(function () {
        state.loading = false;
        render();
      });
  }

  /**
   * Move a task to a new status (drag-and-drop or status dropdown).
   * Applies the change optimistically in local state for instant feedback,
   * then confirms with ClickUp; on failure, shows the error and reloads from
   * the server to undo the optimistic change.
   * @param {string} taskId
   * @param {string} statusName - must match one of state.listMeta.statuses[].status
   */
  function moveTask(taskId, statusName) {
    var task = state.tasks.filter(function (t) { return t.id === taskId; })[0];
    var previousStatus = task ? task.status.status : null;
    if (task) task.status = Object.assign({}, task.status, { status: statusName });
    render();
    clickup.updateTask(state.creds.token, taskId, { status: statusName })
      .catch(function (err) {
        state.error = err.message;
        if (task && previousStatus) task.status = Object.assign({}, task.status, { status: previousStatus });
        render();
      });
  }

  // ==========================================================================
  // DERIVED DATA (computed fresh from state.tasks on each render -- cheap
  // enough at expected list sizes that no memoization is needed)
  // ==========================================================================

  /** Sorted list of distinct account values found across all tasks. */
  function computeAccounts() {
    var set = {};
    state.tasks.forEach(function (t) {
      var v = getCustomFieldValue(t, ACCOUNT_FIELD_NAME).value;
      if (v) set[String(v)] = true;
    });
    return Object.keys(set).sort();
  }

  /** state.tasks filtered by the current account filter. */
  function filteredTasks() {
    if (state.accountFilter === 'all') return state.tasks;
    return state.tasks.filter(function (t) {
      return String(getCustomFieldValue(t, ACCOUNT_FIELD_NAME).value || '') === state.accountFilter;
    });
  }

  // ==========================================================================
  // RENDER -- top level
  // Rebuilds root.innerHTML from scratch based on current state. See the
  // module header comment for which interactions call this vs. skip it.
  // ==========================================================================

  function render() {
    root.innerHTML = state.creds ? appShellHtml() : connectScreenHtml();
  }

  // ---- Connect screen --------------------------------------------------

  function connectScreenHtml() {
    return (
      '<div class="connect-screen"><div class="connect-card">' +
        '<div class="connect-brand">' + brandMarkSvg() +
          '<span style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink)">ContentFlow</span>' +
        '</div>' +
        '<h1 class="connect-title">Connect your workspace</h1>' +
        '<p class="connect-sub">ContentFlow reads and writes directly to your ClickUp list -- there\'s no separate database. Your token stays on this device only.</p>' +
        '<form class="connect-form" id="connect-form">' +
          '<div><label for="cf-token">ClickUp personal API token</label>' +
            '<input id="cf-token" type="password" placeholder="pk_xxxxxxxx_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" autocomplete="off" required /></div>' +
          '<div><label for="cf-listid">List ID</label>' +
            '<input id="cf-listid" type="text" placeholder="e.g. 901234567" required /></div>' +
          '<label class="remember-row"><input id="cf-remember" type="checkbox" checked /> Remember on this device</label>' +
          (state.connectError ? '<div class="status-banner error">' + esc(state.connectError) + '</div>' : '') +
          '<button class="btn btn-primary" type="submit" style="justify-content:center" ' + (state.connecting ? 'disabled' : '') + '>' +
            (state.connecting ? 'Connecting…' : 'Connect') +
          '</button>' +
        '</form>' +
        '<p class="connect-help"><strong>Token:</strong> ClickUp avatar → Settings → Apps → API tokens → Generate.<br/>' +
          '<strong>List ID:</strong> open the list in ClickUp\'s List view and copy the number from the URL.</p>' +
      '</div></div>'
    );
  }

  function brandMarkSvg() {
    return '<span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13 L10 7 L14 11 L20 5" stroke="#21160a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  // ---- Main app shell (topnav + view + modal) ---------------------------

  function appShellHtml() {
    var body;
    if (state.loading && !state.listMeta) {
      body = '<div class="center-loading"><div class="spinner"></div>Loading your ClickUp list…</div>';
    } else {
      var view = state.view === 'board' ? boardHtml() : state.view === 'list' ? listHtml() : calendarHtml();
      body = (state.error ? '<div class="status-banner error">' + esc(state.error) + '</div>' : '') + view;
    }
    return (
      '<div class="app-shell">' +
        topNavHtml() +
        '<main class="main">' + body + '</main>' +
        (state.openTaskId ? taskModalHtml() : '') +
      '</div>'
    );
  }

  function topNavHtml() {
    var accounts = computeAccounts();
    var tabs = ['board', 'list', 'calendar'].map(function (v) {
      return '<button type="button" class="view-tab' + (state.view === v ? ' active' : '') + '" data-action="set-view" data-view="' + v + '">' +
        v.charAt(0).toUpperCase() + v.slice(1) + '</button>';
    }).join('');
    var accountOptions = '<option value="all">All accounts</option>' +
      accounts.map(function (a) { return '<option value="' + esc(a) + '"' + (state.accountFilter === a ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('');

    return (
      '<div class="topnav">' +
        '<div class="brand">' + brandMarkSvg() + 'ContentFlow</div>' +
        '<div class="view-tabs">' + tabs + '</div>' +
        '<div class="topnav-spacer"></div>' +
        '<div class="topnav-right">' +
          (accounts.length ? '<div class="account-filter"><select id="account-filter-select">' + accountOptions + '</select></div>' : '') +
          '<button type="button" class="icon-btn" title="Refresh" data-action="refresh">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0 0 14.9 2.5M19.5 9A8 8 0 0 0 4.6 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>' +
          '<button type="button" class="btn btn-primary btn-sm" data-action="new-task">+ New</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="disconnect">Disconnect</button>' +
        '</div>' +
      '</div>'
    );
  }

  // ---- Board (Kanban) view ------------------------------------------------

  function boardHtml() {
    var statuses = (state.listMeta && state.listMeta.statuses) || [];
    if (!statuses.length) {
      return '<div class="empty-state"><h3>No statuses found</h3><p>This list doesn\'t seem to have any workflow statuses set up in ClickUp yet.</p></div>';
    }
    var tasks = filteredTasks();
    var columns = statuses.map(function (status) {
      var items = tasks.filter(function (t) { return t.status && t.status.status === status.status; });
      var cards = items.map(cardHtml).join('');
      return (
        '<div class="board-column" data-status="' + esc(status.status) + '">' +
          '<div class="board-column-header">' +
            '<span class="status-dot" style="background:' + statusColor(status) + '"></span>' +
            '<span class="board-column-title">' + esc(status.status) + '</span>' +
            '<span class="board-column-count">' + items.length + '</span>' +
          '</div>' +
          cards +
          '<button type="button" class="add-card-btn" data-action="new-task">+ Add task</button>' +
        '</div>'
      );
    }).join('');
    return '<div class="board">' + columns + '</div>';
  }

  function cardHtml(task) {
    var mv = getCustomFieldValue(task, 'Medium(s)');
    var mediums = labelsForDropdownField(mv.field, mv.value);
    var mkcId = getCustomFieldValue(task, 'MKC ID').value;
    var chips = mediums.slice(0, 4).map(function (m) {
      return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
    }).join('') + (mediums.length > 4 ? '<span class="chip-outline">+' + (mediums.length - 4) + '</span>' : '');
    var avatars = (task.assignees || []).slice(0, 3).map(function (a) {
      return '<span class="avatar" style="background:' + colorForString(a.username || a.email) + '" title="' + esc(a.username) + '">' + esc(initials(a.username || a.email)) + '</span>';
    }).join('');
    return (
      '<div class="card" draggable="true" data-task-id="' + task.id + '" data-action="open-task">' +
        '<div class="card-title">' + esc(task.name) + '</div>' +
        (chips ? '<div class="card-meta-row">' + chips + '</div>' : '') +
        '<div class="card-footer">' +
          '<span class="card-id">' + esc(mkcId || task.id) + '</span>' +
          (avatars ? '<div class="avatar-stack">' + avatars + '</div>' : '') +
        '</div>' +
      '</div>'
    );
  }

  // ---- List (table) view --------------------------------------------------

  // Column defs for the sortable list view. `get` extracts a comparable
  // string value per task for both display and sorting.
  var LIST_COLUMNS = [
    { key: 'name', label: 'Task', get: function (t) { return t.name || ''; } },
    { key: 'status', label: 'Status', get: function (t) { return (t.status && t.status.status) || ''; } },
    { key: 'account', label: 'Account', get: function (t) { return String(getCustomFieldValue(t, ACCOUNT_FIELD_NAME).value || ''); } },
    { key: 'mediums', label: 'Mediums', get: function (t) {
        var mv = getCustomFieldValue(t, 'Medium(s)');
        return labelsForDropdownField(mv.field, mv.value).map(function (m) { return m.label || m.name; }).join(', ');
      } },
    { key: 'scheduled', label: 'Scheduled', get: function (t) { return fromClickUpDate(getCustomFieldValue(t, 'Scheduled Date').value); } },
    { key: 'published', label: 'Publish date', get: function (t) { return fromClickUpDate(getCustomFieldValue(t, 'Publish Date').value); } },
    { key: 'assignees', label: 'Assignees', get: function (t) { return (t.assignees || []).map(function (a) { return a.username; }).join(', '); } },
  ];

  function listHtml() {
    var tasks = filteredTasks().slice();
    if (!tasks.length) {
      return '<div class="empty-state"><h3>Nothing here yet</h3><p>Content entries will show up here once they\'re added.</p></div>';
    }
    var sortCol = LIST_COLUMNS.filter(function (c) { return c.key === state.listSortKey; })[0] || LIST_COLUMNS[0];
    var dir = state.listSortDir === 'desc' ? -1 : 1;
    tasks.sort(function (a, b) {
      return dir * String(sortCol.get(a)).localeCompare(String(sortCol.get(b)), undefined, { numeric: true });
    });

    var headerCells = LIST_COLUMNS.map(function (c) {
      var arrow = state.listSortKey === c.key ? (state.listSortDir === 'desc' ? ' \u2193' : ' \u2191') : '';
      return '<th data-action="sort-list" data-key="' + c.key + '">' + c.label + arrow + '</th>';
    }).join('');

    var rows = tasks.map(function (task) {
      var mv = getCustomFieldValue(task, 'Medium(s)');
      var mediums = labelsForDropdownField(mv.field, mv.value).map(function (m) { return m.label || m.name; }).join(', ');
      var account = getCustomFieldValue(task, ACCOUNT_FIELD_NAME).value;
      var scheduled = fromClickUpDate(getCustomFieldValue(task, 'Scheduled Date').value);
      var published = fromClickUpDate(getCustomFieldValue(task, 'Publish Date').value);
      var assignees = (task.assignees || []).map(function (a) { return a.username; }).join(', ');
      return (
        '<tr data-task-id="' + task.id + '" data-action="open-task">' +
          '<td class="task-name-cell">' + esc(task.name) + '</td>' +
          '<td><span class="chip" style="background:' + statusColor(task.status) + '">' + esc(task.status.status) + '</span></td>' +
          '<td>' + (account ? esc(account) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (mediums ? esc(mediums) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (scheduled ? esc(formatDisplayDate(scheduled)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (published ? esc(formatDisplayDate(published)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (assignees ? esc(assignees) : '<span class="muted">—</span>') + '</td>' +
        '</tr>'
      );
    }).join('');

    return '<div class="table-wrap"><table class="list-table"><thead><tr>' + headerCells + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  // Default sort state for the list view (kept outside `state`'s initial
  // literal purely for readability -- functionally identical either way).
  state.listSortKey = 'name';
  state.listSortDir = 'asc';

  // ---- Calendar view --------------------------------------------------------

  function calendarHtml() {
    state.calendarCursor = state.calendarCursor || (function () { var d = new Date(); d.setDate(1); return d; })();
    var cursor = state.calendarCursor;
    var year = cursor.getFullYear(), month = cursor.getMonth();
    var itemsByDate = {};
    filteredTasks().forEach(function (t) {
      var publish = fromClickUpDate(getCustomFieldValue(t, 'Publish Date').value);
      var scheduled = fromClickUpDate(getCustomFieldValue(t, 'Scheduled Date').value);
      var key = publish || scheduled;
      if (!key) return;
      (itemsByDate[key] = itemsByDate[key] || []).push(t);
    });

    var firstOfMonth = new Date(year, month, 1);
    var startOffset = firstOfMonth.getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var todayKey = new Date().toISOString().slice(0, 10);

    var cells = [];
    for (var i = 0; i < startOffset; i++) cells.push({ date: new Date(year, month, 1 - (startOffset - i)), outside: true });
    for (var day = 1; day <= daysInMonth; day++) cells.push({ date: new Date(year, month, day), outside: false });
    while (cells.length % 7 !== 0) {
      var last = cells[cells.length - 1].date;
      cells.push({ date: new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1), outside: true });
    }

    var dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function (d) { return '<div class="calendar-dow">' + d + '</div>'; }).join('');
    var cellsHtml = cells.map(function (c) {
      var key = c.date.toISOString().slice(0, 10);
      var items = itemsByDate[key] || [];
      var shown = items.slice(0, 3).map(function (t) {
        return '<div class="cal-item" style="background:' + statusColor(t.status) + '" data-action="open-task" data-task-id="' + t.id + '" title="' + esc(t.name) + '">' + esc(t.name) + '</div>';
      }).join('');
      var more = items.length > 3 ? '<div class="muted" style="font-size:10.5px">+' + (items.length - 3) + ' more</div>' : '';
      return (
        '<div class="calendar-cell' + (c.outside ? ' outside' : '') + '">' +
          '<div class="calendar-daynum' + (key === todayKey ? ' today' : '') + '">' + c.date.getDate() + '</div>' +
          shown + more +
        '</div>'
      );
    }).join('');

    return (
      '<div class="calendar-header">' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-prev">‹</button>' +
        '<div class="calendar-title">' + cursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + '</div>' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-next">›</button>' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-today">Today</button>' +
      '</div>' +
      '<div class="calendar-grid">' + dow + cellsHtml + '</div>'
    );
  }

  // ---- Task modal (create/edit) --------------------------------------------

  /**
   * Build the initial editable "draft" for the task modal, seeded from an
   * existing task (edit mode) or blank defaults (create mode). Kept separate
   * from the raw ClickUp task object so free-typing inputs can mutate it
   * without touching `state.tasks` until Save is actually pressed.
   * @param {object|null} task - null when creating a new task
   */
  function buildTaskDraft(task) {
    var statuses = (state.listMeta && state.listMeta.statuses) || [];
    var customValues = {};
    state.fields.forEach(function (f) {
      var existing = task ? (task.custom_fields || []).filter(function (cf) { return cf.id === f.id; })[0] : null;
      if (f.type === 'date') customValues[f.id] = fromClickUpDate(existing && existing.value);
      else if (f.type === 'labels') customValues[f.id] = (existing && Array.isArray(existing.value)) ? existing.value.slice() : [];
      else if (f.type === 'drop_down') customValues[f.id] = existing ? existing.value : '';
      else if (f.type === 'checkbox') customValues[f.id] = existing ? (existing.value === 'true' || existing.value === true) : false;
      else customValues[f.id] = existing && existing.value !== undefined && existing.value !== null ? existing.value : '';
    });
    return {
      id: task ? task.id : 'new',
      name: task ? task.name : '',
      status: task ? task.status.status : (statuses[0] && statuses[0].status),
      assigneeIds: {}, // map of memberId -> true, used as a lightweight Set
      originalAssigneeIds: (task ? task.assignees || [] : []).map(function (a) { return a.id; }),
      customValues: customValues,
    };
  }

  /**
   * Open the task modal for either an existing task or a brand-new one, and
   * (for existing tasks) kick off fetching its comments.
   * @param {object|string} taskOrNew - a ClickUp task object, or the literal string 'new'
   */
  function openTaskModal(taskOrNew) {
    var isNew = taskOrNew === 'new';
    var task = isNew ? null : taskOrNew;
    state.openTaskId = isNew ? 'new' : task.id;
    state.taskDraft = buildTaskDraft(task);
    if (!isNew) {
      (task.assignees || []).forEach(function (a) { state.taskDraft.assigneeIds[a.id] = true; });
    }
    state.comments = [];
    state.commentsLoading = !isNew;
    state.newCommentText = '';
    render();
    if (!isNew) {
      clickup.getComments(state.creds.token, task.id)
        .then(function (comments) { state.comments = comments; })
        .catch(function () { /* comments are non-critical; fail silently */ })
        .then(function () { state.commentsLoading = false; render(); });
    }
  }

  function closeTaskModal() {
    state.openTaskId = null;
    state.taskDraft = null;
    render();
  }

  function taskModalHtml() {
    var draft = state.taskDraft;
    var isNew = draft.id === 'new';
    var statuses = (state.listMeta && state.listMeta.statuses) || [];

    var statusOptions = statuses.map(function (s) {
      return '<option value="' + esc(s.status) + '"' + (draft.status === s.status ? ' selected' : '') + '>' + esc(s.status) + '</option>';
    }).join('');

    var assigneePills = state.members.length === 0
      ? '<span class="muted" style="font-size:12.5px">No members found</span>'
      : state.members.map(function (m) {
          var active = !!draft.assigneeIds[m.id];
          return (
            '<button type="button" class="assignee-pill' + (active ? ' active' : '') + '" data-action="toggle-assignee" data-member-id="' + m.id + '">' +
              '<span class="avatar" style="background:' + colorForString(m.username || m.email) + ';width:18px;height:18px;font-size:8.5px;margin-left:0">' + esc(initials(m.username || m.email)) + '</span>' +
              esc(m.username || m.email) +
            '</button>'
          );
        }).join('');

    var fieldInputs = state.fields.map(renderCustomFieldInput).join('');

    var commentsSection = isNew ? '' : (
      '<div class="comments-section"><span class="field-label">Comments</span><div style="margin-top:10px">' +
        (state.commentsLoading ? '<span class="muted" style="font-size:12.5px">Loading comments…</span>' :
          (state.comments.length === 0 ? '<span class="muted" style="font-size:12.5px">No comments yet.</span>' :
            state.comments.map(function (c) {
              var uname = (c.user && c.user.username) || 'U';
              return (
                '<div class="comment">' +
                  '<span class="avatar" style="background:' + colorForString(uname) + ';margin-left:0">' + esc(initials(uname)) + '</span>' +
                  '<div class="comment-body"><div class="comment-author">' + esc(uname) + '</div><div>' + esc(c.comment_text) + '</div></div>' +
                '</div>'
              );
            }).join('')
          )
        ) +
      '</div>' +
      '<form class="comment-form" id="comment-form">' +
        '<textarea id="new-comment-input" placeholder="Add a comment…">' + esc(state.newCommentText) + '</textarea>' +
        '<button class="btn btn-outline btn-sm" type="submit">Post</button>' +
      '</form></div>'
    );

    return (
      '<div class="modal-overlay" id="modal-overlay">' +
        '<div class="modal">' +
          '<div class="modal-header">' +
            '<input class="title-input" id="task-name-input" value="' + esc(draft.name) + '" placeholder="Untitled content entry" />' +
            '<button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
            '</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="field-group"><span class="field-label">Status</span>' +
              '<select class="field-select" id="task-status-select">' + statusOptions + '</select></div>' +
            '<div class="field-group"><span class="field-label">Assignees</span><div class="assignee-row">' + assigneePills + '</div></div>' +
            fieldInputs +
          '</div>' +
          (state.error ? '<div class="status-banner error" style="margin:0 22px 14px">' + esc(state.error) + '</div>' : '') +
          commentsSection +
          '<div class="modal-footer">' +
            '<div>' + (isNew ? '' : '<button type="button" class="btn btn-danger btn-sm" data-action="delete-task" ' + (state.deleting ? 'disabled' : '') + '>' + (state.deleting ? 'Deleting…' : 'Delete task') + '</button>') + '</div>' +
            '<div style="display:flex;gap:8px">' +
              '<button type="button" class="btn btn-outline btn-sm" data-action="close-modal">Cancel</button>' +
              '<button type="button" class="btn btn-primary btn-sm" data-action="save-task" ' + (state.saving ? 'disabled' : '') + '>' + (state.saving ? 'Saving…' : (isNew ? 'Create task' : 'Save changes')) + '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /**
   * Render one custom field's input inside the task modal, dispatching on
   * the field's ClickUp type. Falls back to a plain text input for any type
   * not explicitly handled (url, email, short_text, currency, etc.) so new
   * fields added in ClickUp later still show up without a code change.
   * @param {object} field - a custom field definition from GET /list/{id}/field
   */
  function renderCustomFieldInput(field) {
    var value = state.taskDraft.customValues[field.id];
    var label = '<span class="field-label">' + esc(field.name) + '</span>';

    if (field.type === 'date') {
      return '<div class="field-group">' + label + '<input class="field-input" type="date" data-field-id="' + field.id + '" data-field-kind="date" value="' + esc(value || '') + '" /></div>';
    }
    if (field.type === 'labels') {
      var options = (field.type_config && field.type_config.options) || [];
      var toggles = options.map(function (opt) {
        var active = (value || []).indexOf(opt.id) !== -1;
        return '<button type="button" class="medium-toggle' + (active ? ' active' : '') + '" data-action="toggle-label" data-field-id="' + field.id + '" data-option-id="' + opt.id + '">' + esc(opt.label) + '</button>';
      }).join('');
      return '<div class="field-group full">' + label + '<div class="medium-toggle-group">' + toggles + '</div></div>';
    }
    if (field.type === 'drop_down') {
      var ddOptions = (field.type_config && field.type_config.options) || [];
      var opts = '<option value="">—</option>' + ddOptions.map(function (o) {
        return '<option value="' + o.orderindex + '"' + (String(value) === String(o.orderindex) ? ' selected' : '') + '>' + esc(o.name) + '</option>';
      }).join('');
      return '<div class="field-group">' + label + '<select class="field-select" data-field-id="' + field.id + '" data-field-kind="drop_down">' + opts + '</select></div>';
    }
    if (field.type === 'checkbox') {
      return '<div class="field-group">' + label + '<label class="remember-row" style="margin-top:4px"><input type="checkbox" data-field-id="' + field.id + '" data-field-kind="checkbox" ' + (value ? 'checked' : '') + ' /> Yes</label></div>';
    }
    if (field.type === 'number') {
      return '<div class="field-group">' + label + '<input class="field-input" type="number" data-field-id="' + field.id + '" data-field-kind="number" value="' + esc(value) + '" /></div>';
    }
    // Fallback: plain text (covers "text", "short_text", "url", "email", and anything unrecognized).
    return '<div class="field-group">' + label + '<input class="field-input" type="text" data-field-id="' + field.id + '" data-field-kind="text" value="' + esc(value) + '" /></div>';
  }

  // ==========================================================================
  // SAVE / DELETE / COMMENT ACTIONS
  // ==========================================================================

  /**
   * Persist the task modal's current draft to ClickUp: creates or updates the
   * task itself (name/status/assignees), then writes each custom field
   * individually. Field-level failures are logged but don't block the overall
   * save, since one bad field shouldn't lose the rest of the user's edits.
   */
  function handleSaveTask() {
    var draft = state.taskDraft;
    if (!draft.name || !draft.name.trim()) {
      state.error = 'Give this task a name first.';
      render();
      return;
    }
    state.saving = true;
    state.error = null;
    render();

    var token = state.creds.token, listId = state.creds.listId;
    var assigneeIds = Object.keys(draft.assigneeIds).filter(function (id) { return draft.assigneeIds[id]; });

    var taskPromise;
    if (draft.id === 'new') {
      taskPromise = clickup.createTask(token, listId, { name: draft.name.trim(), status: draft.status, assignees: assigneeIds })
        .then(function (created) { return created.id; });
    } else {
      var toAdd = assigneeIds.filter(function (id) { return draft.originalAssigneeIds.indexOf(id) === -1; });
      var toRemove = draft.originalAssigneeIds.filter(function (id) { return assigneeIds.indexOf(id) === -1; });
      taskPromise = clickup.updateTask(token, draft.id, {
        name: draft.name.trim(),
        status: draft.status,
        assignees: { add: toAdd, rem: toRemove },
      }).then(function () { return draft.id; });
    }

    taskPromise
      .then(function (taskId) {
        // Push each custom field's value one call at a time. ClickUp has no
        // bulk custom-field-update endpoint, so this is N+1 requests -- fine
        // at this list's expected scale (a handful of fields per task).
        var chain = Promise.resolve();
        state.fields.forEach(function (f) {
          chain = chain.then(function () {
            var val = draft.customValues[f.id];
            var payload = val;
            if (f.type === 'date') {
              payload = toClickUpDate(val);
              if (payload === null && !val) return; // nothing to set, skip the call entirely
            }
            if (f.type === 'checkbox') payload = val ? 'true' : 'false';
            if (f.type === 'drop_down' && val !== '') payload = Number(val);
            return clickup.setCustomField(token, taskId, f.id, payload)
              .catch(function (err) { console.warn('Field update failed:', f.name, err.message); });
          });
        });
        return chain;
      })
      .then(function () {
        // Reset BEFORE closing the modal: state.saving is a single shared flag
        // (not per-modal-instance), so leaving it true here would carry over
        // and permanently disable the Save button the next time any task
        // modal opens. (Caught by the automated smoke test -- see git log.)
        state.saving = false;
        closeTaskModal();
        loadAll();
      })
      .catch(function (err) {
        state.saving = false;
        state.error = err.message || 'Could not save this task.';
        render();
      });
  }

  function handleDeleteTask() {
    if (!window.confirm('Delete this task from ClickUp? This can\u2019t be undone.')) return;
    state.deleting = true;
    render();
    clickup.deleteTask(state.creds.token, state.taskDraft.id)
      .then(function () {
        // Same "reset the shared flag on the success path too" fix as
        // handleSaveTask above -- see that comment for why this matters.
        state.deleting = false;
        closeTaskModal();
        loadAll();
      })
      .catch(function (err) {
        state.deleting = false;
        state.error = err.message;
        render();
      });
  }

  function submitComment() {
    var text = (state.newCommentText || '').trim();
    if (!text || state.taskDraft.id === 'new') return;
    state.newCommentText = '';
    clickup.postComment(state.creds.token, state.taskDraft.id, text)
      .then(function () { return clickup.getComments(state.creds.token, state.taskDraft.id); })
      .then(function (comments) { state.comments = comments; render(); })
      .catch(function (err) { state.error = err.message; render(); });
  }

  // ==========================================================================
  // EVENT DELEGATION
  // All listeners are attached ONCE, directly on `root`, and dispatch based on
  // `data-action` / element id, since root.innerHTML is fully replaced on
  // every render() (so per-element listeners would be lost anyway).
  // ==========================================================================

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'connect-form') {
      var token = document.getElementById('cf-token').value.trim();
      var listId = document.getElementById('cf-listid').value.trim();
      var remember = document.getElementById('cf-remember').checked;
      if (token && listId) connect(token, listId, remember);
    } else if (e.target.id === 'comment-form') {
      submitComment(); // RENDER (via submitComment -> render()) -- fine, this is a discrete submit, not a keystroke
    }
  });

  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    switch (action) {
      case 'set-view':
        state.view = el.getAttribute('data-view');
        render(); // RENDER: structural view switch
        break;
      case 'refresh':
        loadAll(); // RENDER: loadAll() re-renders when the fetch settles
        break;
      case 'disconnect':
        disconnect(); // RENDER
        break;
      case 'new-task':
        openTaskModal('new'); // RENDER
        break;
      case 'open-task': {
        var taskId = el.getAttribute('data-task-id');
        var task = state.tasks.filter(function (t) { return t.id === taskId; })[0];
        if (task) openTaskModal(task); // RENDER
        break;
      }
      case 'close-modal':
        closeTaskModal(); // RENDER
        break;
      case 'toggle-assignee': {
        var mid = el.getAttribute('data-member-id');
        state.taskDraft.assigneeIds[mid] = !state.taskDraft.assigneeIds[mid];
        render(); // RENDER: a button toggle, not a text cursor -- safe to re-render
        break;
      }
      case 'toggle-label': {
        var fid = el.getAttribute('data-field-id');
        var oid = el.getAttribute('data-option-id');
        var arr = state.taskDraft.customValues[fid] || [];
        var idx = arr.indexOf(oid);
        if (idx === -1) arr.push(oid); else arr.splice(idx, 1);
        state.taskDraft.customValues[fid] = arr;
        render(); // RENDER
        break;
      }
      case 'save-task':
        handleSaveTask();
        break;
      case 'delete-task':
        handleDeleteTask();
        break;
      case 'cal-prev':
        state.calendarCursor = new Date(state.calendarCursor.getFullYear(), state.calendarCursor.getMonth() - 1, 1);
        render();
        break;
      case 'cal-next':
        state.calendarCursor = new Date(state.calendarCursor.getFullYear(), state.calendarCursor.getMonth() + 1, 1);
        render();
        break;
      case 'cal-today':
        state.calendarCursor = (function () { var d = new Date(); d.setDate(1); return d; })();
        render();
        break;
      case 'sort-list': {
        var key = el.getAttribute('data-key');
        if (state.listSortKey === key) state.listSortDir = state.listSortDir === 'asc' ? 'desc' : 'asc';
        else { state.listSortKey = key; state.listSortDir = 'asc'; }
        render();
        break;
      }
    }

    // Clicking the dark overlay itself (not its modal-card children) closes the modal.
    if (e.target.id === 'modal-overlay') closeTaskModal();
  });

  root.addEventListener('change', function (e) {
    if (e.target.id === 'account-filter-select') {
      state.accountFilter = e.target.value;
      render(); // RENDER: structural (changes which tasks are shown everywhere)
      return;
    }
    if (e.target.id === 'task-status-select') {
      // NO-RENDER: captured into the draft for use at Save time; the visual
      // board grouping only needs to update after Save, not while editing.
      state.taskDraft.status = e.target.value;
      return;
    }
    var fieldId = e.target.getAttribute('data-field-id');
    if (fieldId) {
      // NO-RENDER: custom field dropdown/checkbox/date changes just update
      // the draft; see the 'input' handler below for the text/number/date
      // typing case (dates fire 'change', not 'input', in most browsers,
      // which is why date is handled in both places defensively).
      var kind = e.target.getAttribute('data-field-kind');
      if (kind === 'checkbox') state.taskDraft.customValues[fieldId] = e.target.checked;
      else state.taskDraft.customValues[fieldId] = e.target.value;
    }
  });

  root.addEventListener('input', function (e) {
    // NO-RENDER handlers: every case here only writes into `state`, never
    // calls render(), so the browser's native text-cursor position is
    // preserved while the user is actively typing.
    if (e.target.id === 'task-name-input') {
      state.taskDraft.name = e.target.value;
      return;
    }
    if (e.target.id === 'new-comment-input') {
      state.newCommentText = e.target.value;
      return;
    }
    var fieldId = e.target.getAttribute('data-field-id');
    if (fieldId) {
      var kind = e.target.getAttribute('data-field-kind');
      state.taskDraft.customValues[fieldId] = kind === 'number' ? e.target.value : e.target.value;
    }
  });

  // ---- Drag-and-drop (board columns) ---------------------------------------
  // dragover/drop bubble normally, so plain delegation on `root` works here
  // too, using closest('.board-column') to find the drop target regardless
  // of which child element the pointer is actually over.

  root.addEventListener('dragstart', function (e) {
    var card = e.target.closest && e.target.closest('.card[draggable]');
    if (card) e.dataTransfer.setData('text/task-id', card.getAttribute('data-task-id'));
  });

  root.addEventListener('dragover', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (col) { e.preventDefault(); col.classList.add('drag-over'); }
  });

  root.addEventListener('dragleave', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (col) col.classList.remove('drag-over');
  });

  root.addEventListener('drop', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (!col) return;
    e.preventDefault();
    col.classList.remove('drag-over');
    var taskId = e.dataTransfer.getData('text/task-id');
    var statusName = col.getAttribute('data-status');
    if (taskId && statusName) moveTask(taskId, statusName); // RENDER (inside moveTask)
  });

  // ==========================================================================
  // BOOT
  // ==========================================================================
  state.creds = loadCreds();
  render();
  if (state.creds) loadAll();

</script>
</body>
</html>
