  function brandMarkSvg() {
    return '<span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13 L10 7 L14 11 L20 5" stroke="#21160a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  // ---- Main app shell (topnav + view + modal) ---------------------------

  function appShellHtml() {
    var body;
    if (state.loading && !state.listMeta) {
      body = '<div class="center-loading"><div class="spinner"></div>Loading your ClickUp list…</div>';
    } else {
      var view = state.view === 'board' ? boardHtml() : state.view === 'list' ? listHtml() : state.view === 'dashboard' ? dashboardHtml() : calendarHtml();
      body = (state.error ? '<div class="status-banner error">' + esc(state.error) + '</div>' : '') + view;
    }
    return (
      '<div class="app-shell">' +
        topNavHtml() +
        '<main class="main">' + body + '</main>' +
        (state.openTaskId ? taskModalHtml() : '') +
      '</div>'
    );
  }

  function topNavHtml() {
    var accounts = computeAccounts();
    var tabs = ['dashboard', 'board', 'list', 'calendar'].map(function (v) {
      return '<button type="button" class="view-tab' + (state.view === v ? ' active' : '') + '" data-action="set-view" data-view="' + v + '">' +
        v.charAt(0).toUpperCase() + v.slice(1) + '</button>';
    }).join('');
    var accountOptions = '<option value="all">All accounts</option>' +
      accounts.map(function (a) { return '<option value="' + esc(a) + '"' + (state.accountFilter === a ? ' selected' : '') + '>' + esc(accountDisplayName(a)) + '</option>'; }).join('');
    var isAdmin = state.profile && state.profile.role === 'admin';

    return (
      '<div class="topnav">' +
        '<div class="brand">' + brandMarkSvg() + 'ContentFlow</div>' +
        '<div class="view-tabs">' + tabs + '</div>' +
        '<div class="topnav-spacer"></div>' +
        '<div class="topnav-right">' +
          (accounts.length ? '<div class="account-filter"><select id="account-filter-select">' + accountOptions + '</select></div>' : '') +
          '<button type="button" class="icon-btn" title="Refresh" data-action="refresh">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0 0 14.9 2.5M19.5 9A8 8 0 0 0 4.6 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>' +
          '<button type="button" class="btn btn-primary btn-sm" data-action="new-task">+ New</button>' +
          (isAdmin ? '<button type="button" class="btn btn-ghost btn-sm" data-action="open-admin-panel">Admin</button>' : '') +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="disconnect">Disconnect ClickUp</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out">Sign out</button>' +
        '</div>' +
      '</div>'
    );
  }

  // ---- Client-role shell (read-only: view + comment, no ClickUp connection) ----
  // Clients never get a ClickUp token -- all data here comes from our own
  // backend (state.clientTasks, loaded via loadClientTasks()/backendFetch()),
  // already filtered server-side to their own account(s). This shell is
  // intentionally separate from appShellHtml()/boardHtml()/etc above rather
  // than reusing them with a bunch of "if not readOnly" branches threaded
  // through drag-and-drop, the task modal, and custom field editing -- for a
  // view-and-comment-only surface, a smaller dedicated set of render
  // functions is easier to keep correct than retrofitting the editable ones.

  function clientTopNavHtml() {
    var tabs = ['dashboard', 'board', 'list'].map(function (v) {
      return '<button type="button" class="view-tab' + (state.view === v ? ' active' : '') + '" data-action="set-view" data-view="' + v + '">' +
        v.charAt(0).toUpperCase() + v.slice(1) + '</button>';
    }).join('');
    return (
      '<div class="topnav">' +
        '<div class="brand">' + brandMarkSvg() + 'ContentFlow</div>' +
        '<div class="view-tabs">' + tabs + '</div>' +
        '<div class="topnav-spacer"></div>' +
        '<div class="topnav-right">' +
          '<button type="button" class="icon-btn" title="Refresh" data-action="client-refresh">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0 0 14.9 2.5M19.5 9A8 8 0 0 0 4.6 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out">Sign out</button>' +
        '</div>' +
      '</div>'
    );
  }

  function clientCardHtml(task) {
    var acct = getCustomFieldValue(task, ACCOUNT_FIELD_NAME).value;
    var mv = getCustomFieldValue(task, 'Medium(s)');
    var mediums = labelsForDropdownField(mv.field, mv.value);
    var chips = mediums.map(function (m) {
      return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
    }).join('');
    return (
      '<div class="card" data-action="client-open-task" data-task-id="' + esc(task.id) + '">' +
        (acct ? '<div class="account-badge">' + esc(accountDisplayName(acct)) + '</div>' : '') +
        '<div class="card-title">' + esc(task.name) + '</div>' +
        (chips ? '<div class="card-meta-row">' + chips + '</div>' : '') +
      '</div>'
    );
  }

  function clientDashboardHtml() {
    return dashboardBodyHtml(state.clientTasks, 'client-open-task');
  }

  function clientBoardHtml() {
    var tasks = state.clientTasks;
    var statusesSeen = {};
    var order = [];
    tasks.forEach(function (t) {
      var name = t.status ? t.status.status : '(no status)';
      if (!statusesSeen[name]) { statusesSeen[name] = { color: t.status && t.status.color, tasks: [] }; order.push(name); }
      statusesSeen[name].tasks.push(t);
    });
    if (order.length === 0) return '<div class="empty-state">No tasks yet for your account.</div>';
    return '<div class="board">' + order.map(function (name) {
      var col = statusesSeen[name];
      return (
        '<div class="board-column">' +
          '<div class="board-column-header"><span class="status-dot" style="background:' + esc(hexColor(col.color)) + '"></span>' + esc(name) + ' <span class="count">' + col.tasks.length + '</span></div>' +
          '<div class="board-column-body">' + col.tasks.map(clientCardHtml).join('') + '</div>' +
        '</div>'
      );
    }).join('') + '</div>';
  }

  function clientListHtml() {
    var tasks = state.clientTasks;
    if (tasks.length === 0) return '<div class="empty-state">No tasks yet for your account.</div>';
    return (
      '<table class="list-table"><thead><tr><th>Name</th><th>Status</th><th>Account</th><th>Mediums</th></tr></thead><tbody>' +
        tasks.map(function (t) {
          var mv = getCustomFieldValue(t, 'Medium(s)');
          var chips = labelsForDropdownField(mv.field, mv.value).map(function (m) {
            return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
          }).join(' ');
          var acct = getCustomFieldValue(t, ACCOUNT_FIELD_NAME).value;
          return (
            '<tr data-action="client-open-task" data-task-id="' + esc(t.id) + '">' +
              '<td>' + esc(t.name) + '</td>' +
              '<td><span class="status-dot" style="background:' + esc(statusColor(t.status)) + '"></span>' + esc(t.status ? t.status.status : '') + '</td>' +
              '<td>' + (acct ? esc(accountDisplayName(acct)) : '<span class="muted">—</span>') + '</td>' +
              '<td>' + (chips || '<span class="muted">—</span>') + '</td>' +
            '</tr>'
          );
        }).join('') +
      '</tbody></table>'
    );
  }

  /** Read-only task detail + comments panel for a client-role user. */
  function clientTaskPanelHtml() {
    var task = state.clientTasks.filter(function (t) { return t.id === state.clientOpenTaskId; })[0];
    if (!task) return '';
    var accountId = getCustomFieldValue(task, ACCOUNT_FIELD_NAME).value;
    var filesSection = filesSectionHtml(state.clientTaskFiles, task.id, accountId, 'client', state.clientTaskFilesLoading, state.clientTaskFilesError, state.clientFileUploading);
    var logHtml = state.clientCommentsLoading
      ? '<div class="center-loading"><div class="spinner"></div></div>'
      : (state.clientComments.length === 0 ? '<div class="empty-state">Nothing logged yet.</div>' :
          state.clientComments.map(function (c) {
            var author = (c.user && c.user.username) || 'Someone';
            var text = c.comment_text || (c.comment && c.comment.map(function (p) { return p.text; }).join('')) || '';
            return '<div class="comment"><div class="comment-author">' + esc(author) + '</div><div class="comment-text">' + esc(text) + '</div></div>';
          }).join(''));
    return (
      '<div class="modal-overlay" id="client-modal-overlay">' +
        '<div class="modal-card">' +
          '<div class="modal-header"><h2>' + (accountId ? '<div class="account-badge">' + esc(accountDisplayName(accountId)) + '</div>' : '') + esc(task.name) + '</h2><button type="button" class="icon-btn" data-action="client-close-task">✕</button></div>' +
          '<div class="modal-body">' +
            '<p><strong>Status:</strong> ' + esc(task.status ? task.status.status : '') + '</p>' +
            filesSection +
            '<h3>Log</h3>' +
            '<div class="comments-list">' + logHtml + '</div>' +
            '<form class="comment-form" id="client-comment-form">' +
              '<textarea id="client-comment-input" placeholder="Log an update…">' + esc(state.clientNewCommentText) + '</textarea>' +
              '<button class="btn btn-primary btn-sm" type="submit" ' + (state.clientPostingComment ? 'disabled' : '') + '>' +
                (state.clientPostingComment ? 'Posting…' : 'Post') +
              '</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function waitingForAccessHtml() {
    return (
      '<div class="connect-screen"><div class="connect-card">' +
        '<div class="connect-brand">' + brandMarkSvg() +
          '<span style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink)">ContentFlow</span>' +
        '</div>' +
        '<h1 class="connect-title">Almost there</h1>' +
        '<p class="connect-sub">You\'re signed in, but your admin hasn\'t linked your account to a company yet. Once they do, your content strategy will show up here automatically -- no action needed from you.</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out" style="margin-top:12px">Sign out</button>' +
      '</div></div>'
    );
  }

  function clientShellHtml() {
    if (state.accountAccess.length === 0) return waitingForAccessHtml();
    var body;
    if (state.clientLoading && state.clientTasks.length === 0) {
      body = '<div class="center-loading"><div class="spinner"></div>Loading…</div>';
    } else {
      body = (state.clientError ? '<div class="status-banner error">' + esc(state.clientError) + '</div>' : '') +
        (state.view === 'list' ? clientListHtml() : state.view === 'dashboard' ? clientDashboardHtml() : clientBoardHtml());
    }
    return (
      '<div class="app-shell">' +
        clientTopNavHtml() +
        '<main class="main">' + body + '</main>' +
        (state.clientOpenTaskId ? clientTaskPanelHtml() : '') +
      '</div>'
    );
  }

  // ---- Admin panel (invite users, see who has access) ------------------------

  function adminShellHtml() {
    var rows = state.adminUsers.map(function (u) {
      var accts = u.accounts.map(function (a) { return esc(a.clickupAccountId); }).join(', ');
      return (
        '<tr><td>' + esc(u.email) + '</td><td>' + esc(u.displayName || '') + '</td>' +
          '<td>' + esc(u.role) + '</td><td>' + (accts || '<span class="text-faint">--</span>') + '</td></tr>'
      );
    }).join('');

    return (
      '<div class="app-shell">' +
        '<div class="topnav">' +
          '<div class="brand">' + brandMarkSvg() + 'ContentFlow -- Admin</div>' +
          '<div class="topnav-spacer"></div>' +
          '<div class="topnav-right">' +
            '<button type="button" class="btn btn-ghost btn-sm" data-action="close-admin-panel">Back to board</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out">Sign out</button>' +
          '</div>' +
        '</div>' +
        '<main class="main">' +
          '<h2>Invite someone</h2>' +
          '<form class="connect-form" id="invite-form" style="max-width:420px">' +
            '<div><label for="invite-email">Email</label><input id="invite-email" type="email" required value="' + esc(state.inviteEmail) + '" /></div>' +
            '<div><label for="invite-name">Name (optional)</label><input id="invite-name" type="text" value="' + esc(state.inviteDisplayName) + '" /></div>' +
            '<div><label for="invite-role">Role</label><select id="invite-role">' +
              ['admin', 'rep', 'client'].map(function (r) { return '<option value="' + r + '"' + (state.inviteRole === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') +
            '</select></div>' +
            '<div><label for="invite-accounts">MKC ID(s) from Companies &amp; Accounts, comma-separated</label>' +
              '<input id="invite-accounts" type="text" placeholder="e.g. 86e1q3bwu" value="' + esc(state.inviteAccountIds) + '" /></div>' +
              '<p class="connect-help" style="margin:-6px 0 0">Open the client\'s entry in Companies &amp; Accounts and copy its MKC ID -- it must match the Related Account ID on their tasks exactly.</p>' +
            (state.inviteError ? '<div class="status-banner error">' + esc(state.inviteError) + '</div>' : '') +
            (state.inviteSuccess ? '<div class="status-banner">' + esc(state.inviteSuccess) + '</div>' : '') +
            '<button class="btn btn-primary" type="submit" ' + (state.inviting ? 'disabled' : '') + '>' + (state.inviting ? 'Sending…' : 'Send invite') + '</button>' +
          '</form>' +
          '<h2 style="margin-top:32px">Everyone with access</h2>' +
          (state.adminUsersLoading ? '<div class="center-loading"><div class="spinner"></div></div>' :
            (state.adminUsersError ? '<div class="status-banner error">' + esc(state.adminUsersError) + '</div>' :
              '<table class="list-table"><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Accounts</th></tr></thead><tbody>' + rows + '</tbody></table>')) +
        '</main>' +
      '</div>'
    );
  }

  // ---- Dashboard view (admin/rep) -------------------------------------------

  function dashboardHtml() {
    return dashboardBodyHtml(filteredTasks(), 'open-task');
  }

  // ---- Board (Kanban) view ------------------------------------------------

  function boardHtml() {
    var statuses = (state.listMeta && state.listMeta.statuses) || [];
    if (!statuses.length) {
      return '<div class="empty-state"><h3>No statuses found</h3><p>This list doesn\'t seem to have any workflow statuses set up in ClickUp yet.</p></div>';
    }
    var tasks = filteredTasks();
    var columns = statuses.map(function (status) {
      var items = tasks.filter(function (t) { return t.status && t.status.status === status.status; });
      var cards = items.map(cardHtml).join('');
      return (
        '<div class="board-column" data-status="' + esc(status.status) + '">' +
          '<div class="board-column-header">' +
            '<span class="status-dot" style="background:' + statusColor(status) + '"></span>' +
            '<span class="board-column-title">' + esc(status.status) + '</span>' +
            '<span class="board-column-count">' + items.length + '</span>' +
          '</div>' +
          cards +
          '<button type="button" class="add-card-btn" data-action="new-task">+ Add task</button>' +
        '</div>'
      );
    }).join('');
    return '<div class="board">' + columns + '</div>';
  }

  function cardHtml(task) {
    var mv = getCustomFieldValue(task, 'Medium(s)');
    var mediums = labelsForDropdownField(mv.field, mv.value);
    var mkcId = getCustomFieldValue(task, 'MKC ID').value;
    var accountId = getCustomFieldValue(task, ACCOUNT_FIELD_NAME).value;
    var chips = mediums.slice(0, 4).map(function (m) {
      return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
    }).join('') + (mediums.length > 4 ? '<span class="chip-outline">+' + (mediums.length - 4) + '</span>' : '');
    var avatars = (task.assignees || []).slice(0, 3).map(function (a) {
      return '<span class="avatar" style="background:' + colorForString(a.username || a.email) + '" title="' + esc(a.username) + '">' + esc(initials(a.username || a.email)) + '</span>';
    }).join('');
    return (
      '<div class="card" draggable="true" data-task-id="' + task.id + '" data-action="open-task">' +
        (accountId ? '<div class="account-badge">' + esc(accountDisplayName(accountId)) + '</div>' : '') +
        '<div class="card-title">' + esc(task.name) + '</div>' +
        (chips ? '<div class="card-meta-row">' + chips + '</div>' : '') +
        '<div class="card-footer">' +
          '<span class="card-id">' + esc(mkcId || task.id) + '</span>' +
          (avatars ? '<div class="avatar-stack">' + avatars + '</div>' : '') +
        '</div>' +
      '</div>'
    );
  }

  // ---- List (table) view --------------------------------------------------

  // Column defs for the sortable list view. `get` extracts a comparable
  // string value per task for both display and sorting.
  var LIST_COLUMNS = [
    { key: 'name', label: 'Task', get: function (t) { return t.name || ''; } },
    { key: 'status', label: 'Status', get: function (t) { return (t.status && t.status.status) || ''; } },
    { key: 'account', label: 'Account', get: function (t) { return accountDisplayName(getCustomFieldValue(t, ACCOUNT_FIELD_NAME).value); } },
    { key: 'mediums', label: 'Mediums', get: function (t) {
        var mv = getCustomFieldValue(t, 'Medium(s)');
        return labelsForDropdownField(mv.field, mv.value).map(function (m) { return m.label || m.name; }).join(', ');
      } },
    { key: 'scheduled', label: 'Scheduled', get: function (t) { return fromClickUpDate(getCustomFieldValue(t, 'Scheduled Date').value); } },
    { key: 'published', label: 'Publish date', get: function (t) { return fromClickUpDate(getCustomFieldValue(t, 'Publish Date').value); } },
    { key: 'assignees', label: 'Assignees', get: function (t) { return (t.assignees || []).map(function (a) { return a.username; }).join(', '); } },
  ];

  function listHtml() {
    var tasks = filteredTasks().slice();
    if (!tasks.length) {
      return '<div class="empty-state"><h3>Nothing here yet</h3><p>Content entries will show up here once they\'re added.</p></div>';
    }
    var sortCol = LIST_COLUMNS.filter(function (c) { return c.key === state.listSortKey; })[0] || LIST_COLUMNS[0];
    var dir = state.listSortDir === 'desc' ? -1 : 1;
    tasks.sort(function (a, b) {
      return dir * String(sortCol.get(a)).localeCompare(String(sortCol.get(b)), undefined, { numeric: true });
    });

    var headerCells = LIST_COLUMNS.map(function (c) {
      var arrow = state.listSortKey === c.key ? (state.listSortDir === 'desc' ? ' \u2193' : ' \u2191') : '';
      return '<th data-action="sort-list" data-key="' + c.key + '">' + c.label + arrow + '</th>';
    }).join('');

    var rows = tasks.map(function (task) {
      var mv = getCustomFieldValue(task, 'Medium(s)');
      var mediumLabels = labelsForDropdownField(mv.field, mv.value);
      var mediumsHtml = mediumLabels.map(function (m) {
        return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
      }).join(' ');
      var account = getCustomFieldValue(task, ACCOUNT_FIELD_NAME).value;
      var scheduled = fromClickUpDate(getCustomFieldValue(task, 'Scheduled Date').value);
      var published = fromClickUpDate(getCustomFieldValue(task, 'Publish Date').value);
      var assignees = (task.assignees || []).map(function (a) { return a.username; }).join(', ');
      return (
        '<tr data-task-id="' + task.id + '" data-action="open-task">' +
          '<td class="task-name-cell">' + esc(task.name) + '</td>' +
          '<td><span class="chip" style="background:' + statusColor(task.status) + '">' + esc(task.status.status) + '</span></td>' +
          '<td>' + (account ? esc(accountDisplayName(account)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (mediumsHtml || '<span class="muted">—</span>') + '</td>' +
          '<td>' + (scheduled ? esc(formatDisplayDate(scheduled)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (published ? esc(formatDisplayDate(published)) : '<span class="muted">—</span>') + '</td>' +
          '<td>' + (assignees ? esc(assignees) : '<span class="muted">—</span>') + '</td>' +
        '</tr>'
      );
    }).join('');

    return '<div class="table-wrap"><table class="list-table"><thead><tr>' + headerCells + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  // Default sort state for the list view (kept outside `state`'s initial
  // literal purely for readability -- functionally identical either way).
  state.listSortKey = 'name';
  state.listSortDir = 'asc';

  // ---- Calendar view --------------------------------------------------------

  function calendarHtml() {
    state.calendarCursor = state.calendarCursor || (function () { var d = new Date(); d.setDate(1); return d; })();
    var cursor = state.calendarCursor;
    var year = cursor.getFullYear(), month = cursor.getMonth();
    var itemsByDate = {};
    filteredTasks().forEach(function (t) {
      var publish = fromClickUpDate(getCustomFieldValue(t, 'Publish Date').value);
      var scheduled = fromClickUpDate(getCustomFieldValue(t, 'Scheduled Date').value);
      var key = publish || scheduled;
      if (!key) return;
      (itemsByDate[key] = itemsByDate[key] || []).push(t);
    });

    var firstOfMonth = new Date(year, month, 1);
    var startOffset = firstOfMonth.getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var todayKey = new Date().toISOString().slice(0, 10);

    var cells = [];
    for (var i = 0; i < startOffset; i++) cells.push({ date: new Date(year, month, 1 - (startOffset - i)), outside: true });
    for (var day = 1; day <= daysInMonth; day++) cells.push({ date: new Date(year, month, day), outside: false });
    while (cells.length % 7 !== 0) {
      var last = cells[cells.length - 1].date;
      cells.push({ date: new Date(last.getFullYear(), last.getMonth(), last.getDate() + 1), outside: true });
    }

    var dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function (d) { return '<div class="calendar-dow">' + d + '</div>'; }).join('');
    var cellsHtml = cells.map(function (c) {
      var key = c.date.toISOString().slice(0, 10);
      var items = itemsByDate[key] || [];
      var shown = items.slice(0, 3).map(function (t) {
        return '<div class="cal-item" style="background:' + statusColor(t.status) + '" data-action="open-task" data-task-id="' + t.id + '" title="' + esc(t.name) + '">' + esc(t.name) + '</div>';
      }).join('');
      var more = items.length > 3 ? '<div class="muted" style="font-size:10.5px">+' + (items.length - 3) + ' more</div>' : '';
      return (
        '<div class="calendar-cell' + (c.outside ? ' outside' : '') + '">' +
          '<div class="calendar-daynum' + (key === todayKey ? ' today' : '') + '">' + c.date.getDate() + '</div>' +
          shown + more +
        '</div>'
      );
    }).join('');

    return (
      '<div class="calendar-header">' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-prev">‹</button>' +
        '<div class="calendar-title">' + cursor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + '</div>' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-next">›</button>' +
        '<button type="button" class="btn btn-outline btn-sm" data-action="cal-today">Today</button>' +
      '</div>' +
      '<div class="calendar-grid">' + dow + cellsHtml + '</div>'
    );
  }

  // ---- Task modal (create/edit) --------------------------------------------

  /**
   * Build the initial editable "draft" for the task modal, seeded from an
   * existing task (edit mode) or blank defaults (create mode). Kept separate
   * from the raw ClickUp task object so free-typing inputs can mutate it
   * without touching `state.tasks` until Save is actually pressed.
   * @param {object|null} task - null when creating a new task
   */
  function buildTaskDraft(task) {
    var statuses = (state.listMeta && state.listMeta.statuses) || [];
    var customValues = {};
    state.fields.forEach(function (f) {
      var existing = task ? (task.custom_fields || []).filter(function (cf) { return cf.id === f.id; })[0] : null;
      if (f.type === 'date') customValues[f.id] = fromClickUpDate(existing && existing.value);
      else if (f.type === 'labels') customValues[f.id] = (existing && Array.isArray(existing.value)) ? existing.value.slice() : [];
      else if (f.type === 'drop_down') customValues[f.id] = existing ? existing.value : '';
      else if (f.type === 'checkbox') customValues[f.id] = existing ? (existing.value === 'true' || existing.value === true) : false;
      else customValues[f.id] = existing && existing.value !== undefined && existing.value !== null ? existing.value : '';
    });
    return {
      id: task ? task.id : 'new',
      name: task ? task.name : '',
      status: task ? task.status.status : (statuses[0] && statuses[0].status),
      assigneeIds: {}, // map of memberId -> true, used as a lightweight Set
      originalAssigneeIds: (task ? task.assignees || [] : []).map(function (a) { return a.id; }),
      customValues: customValues,
    };
  }

  /**
   * Open the task modal for either an existing task or a brand-new one, and
   * (for existing tasks) kick off fetching its comments.
   * @param {object|string} taskOrNew - a ClickUp task object, or the literal string 'new'
   */
  function openTaskModal(taskOrNew) {
    var isNew = taskOrNew === 'new';
    var task = isNew ? null : taskOrNew;
    state.openTaskId = isNew ? 'new' : task.id;
    state.taskDraft = buildTaskDraft(task);
    if (!isNew) {
      (task.assignees || []).forEach(function (a) { state.taskDraft.assigneeIds[a.id] = true; });
    }
    state.comments = [];
    state.commentsLoading = !isNew;
    state.newCommentText = '';
    state.taskFiles = [];
    state.taskFilesError = null;
    state.taskFilesLoading = !isNew;
    render();
    if (!isNew) {
      clickup.getComments(state.creds.token, task.id)
        .then(function (comments) { state.comments = comments; })
        .catch(function () { /* comments are non-critical; fail silently */ })
        .then(function () { state.commentsLoading = false; render(); });
      loadTaskFiles(task.id);
    }
  }

  function closeTaskModal() {
    state.openTaskId = null;
    state.taskDraft = null;
    render();
  }

  /**
   * Renders the Files section: one group per category the caller's role can
   * see, each with its files and (if allowed) an upload control. Shared by
   * taskModalHtml() and clientTaskPanelHtml() -- role decides which
   * categories show and which are uploadable, everything else is identical.
   */
  function filesSectionHtml(files, taskId, accountId, role, loading, errorMsg, uploadingFlag) {
    var visibleCategories = FILE_CATEGORIES.filter(function (c) { return role === 'admin' || role === 'rep' || c.clientVisible; });
    var groups = visibleCategories.map(function (cat) {
      var catFiles = files.filter(function (f) { return f.category === cat.key; });
      var canUpload = role === 'admin' || role === 'rep' || CLIENT_UPLOADABLE_CATEGORIES.indexOf(cat.key) !== -1;
      var isUploadingThis = role === 'client' ? !!uploadingFlag : uploadingFlag === cat.key;
      var fileRows = catFiles.map(function (f) {
        return (
          '<div class="file-row">' +
            '<span class="file-name" data-action="download-file" data-file-id="' + f.id + '">' + esc(f.filename) + '</span>' +
            '<span class="file-meta">' + esc(formatFileSize(f.sizeBytes)) + '</span>' +
            (role !== 'client' ? '<button type="button" class="icon-btn" data-action="delete-file" data-file-id="' + f.id + '" data-task-id="' + esc(taskId) + '" title="Delete">✕</button>' : '') +
          '</div>'
        );
      }).join('');
      return (
        '<div class="file-category">' +
          '<div class="file-category-header">' + esc(cat.label) + (catFiles.length ? ' <span class="count">' + catFiles.length + '</span>' : '') + '</div>' +
          (fileRows || '<div class="muted" style="font-size:12px">No files yet.</div>') +
          (canUpload ? (
            '<label class="upload-btn' + (isUploadingThis ? ' disabled' : '') + '">' + (isUploadingThis ? 'Uploading…' : '+ Upload') +
              '<input type="file" style="display:none" data-action="upload-file" data-category="' + cat.key + '" data-task-id="' + esc(taskId) + '" data-account-id="' + esc(accountId || '') + '" data-role="' + role + '"' + (isUploadingThis ? ' disabled' : '') + ' />' +
            '</label>'
          ) : '') +
        '</div>'
      );
    }).join('');
    return (
      '<div class="files-section"><span class="field-label">Files</span>' +
        (errorMsg ? '<div class="status-banner error" style="margin:8px 0">' + esc(errorMsg) + '</div>' : '') +
        (loading ? '<div class="muted" style="font-size:12.5px;margin-top:8px">Loading files…</div>' : '<div class="file-categories">' + groups + '</div>') +
      '</div>'
    );
  }

  function taskModalHtml() {
    var draft = state.taskDraft;
    var isNew = draft.id === 'new';
    var statuses = (state.listMeta && state.listMeta.statuses) || [];

    var statusOptions = statuses.map(function (s) {
      return '<option value="' + esc(s.status) + '"' + (draft.status === s.status ? ' selected' : '') + '>' + esc(s.status) + '</option>';
    }).join('');

    var assigneePills = state.members.length === 0
      ? '<span class="muted" style="font-size:12.5px">No members found</span>'
      : state.members.map(function (m) {
          var active = !!draft.assigneeIds[m.id];
          return (
            '<button type="button" class="assignee-pill' + (active ? ' active' : '') + '" data-action="toggle-assignee" data-member-id="' + m.id + '">' +
              '<span class="avatar" style="background:' + colorForString(m.username || m.email) + ';width:18px;height:18px;font-size:8.5px;margin-left:0">' + esc(initials(m.username || m.email)) + '</span>' +
              esc(m.username || m.email) +
            '</button>'
          );
        }).join('');

    // The account field gets its own badge/select in the header instead of
    // a regular field row -- pulled out of the generic list here.
    var accountField = state.fields.filter(function (f) { return f.name === ACCOUNT_FIELD_NAME; })[0];
    var fieldInputs = state.fields.filter(function (f) { return f.name !== ACCOUNT_FIELD_NAME; }).map(renderCustomFieldInput).join('');
    var accountBadgeHtml = '';
    if (accountField) {
      var accountValue = draft.customValues[accountField.id];
      var dirIds = Object.keys(state.accountsDirectory || {}).sort(function (a, b) {
        return state.accountsDirectory[a].localeCompare(state.accountsDirectory[b]);
      });
      var accountOptHtml = dirIds.map(function (id) {
        return '<option value="' + esc(id) + '"' + (String(accountValue) === String(id) ? ' selected' : '') + '>' + esc(state.accountsDirectory[id]) + '</option>';
      }).join('');
      // If the current value isn't in the loaded directory yet (directory
      // still loading, or a stale id), still show it correctly rather than
      // silently falling back to "No account" in the <select>.
      if (accountValue && !(state.accountsDirectory && state.accountsDirectory[String(accountValue)])) {
        accountOptHtml = '<option value="' + esc(accountValue) + '" selected>' + esc(accountDisplayName(accountValue)) + '</option>' + accountOptHtml;
      }
      accountBadgeHtml = (
        '<select class="account-badge-select" id="task-account-select" data-field-id="' + accountField.id + '">' +
          '<option value="">No account</option>' + accountOptHtml +
        '</select>'
      );
    }
    var accountIdForFiles = accountField ? draft.customValues[accountField.id] : null;
    var filesSection = isNew ? '' : filesSectionHtml(state.taskFiles, draft.id, accountIdForFiles, state.profile.role, state.taskFilesLoading, state.taskFilesError, state.taskFileUploading);

    var commentsSection = isNew ? '' : (
      '<div class="comments-section"><span class="field-label">Log</span><div style="margin-top:10px">' +
        (state.commentsLoading ? '<span class="muted" style="font-size:12.5px">Loading log…</span>' :
          (state.comments.length === 0 ? '<span class="muted" style="font-size:12.5px">Nothing logged yet.</span>' :
            state.comments.map(function (c) {
              var uname = (c.user && c.user.username) || 'U';
              return (
                '<div class="comment">' +
                  '<span class="avatar" style="background:' + colorForString(uname) + ';margin-left:0">' + esc(initials(uname)) + '</span>' +
                  '<div class="comment-body"><div class="comment-author">' + esc(uname) + '</div><div>' + esc(c.comment_text) + '</div></div>' +
                '</div>'
              );
            }).join('')
          )
        ) +
      '</div>' +
      '<form class="comment-form" id="comment-form">' +
        '<textarea id="new-comment-input" placeholder="Log an update…">' + esc(state.newCommentText) + '</textarea>' +
        '<button class="btn btn-outline btn-sm" type="submit">Post</button>' +
      '</form></div>'
    );

    return (
      '<div class="modal-overlay" id="modal-overlay">' +
        '<div class="modal">' +
          '<div class="modal-header">' +
            '<div style="flex:1;min-width:0">' +
              (accountBadgeHtml ? '<div style="margin-bottom:6px">' + accountBadgeHtml + '</div>' : '') +
              '<input class="title-input" id="task-name-input" value="' + esc(draft.name) + '" placeholder="Untitled content entry" />' +
            '</div>' +
            '<button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
            '</button>' +
          '</div>' +
          '<div class="modal-body">' +
            '<div class="field-group"><span class="field-label">Status</span>' +
              '<select class="field-select" id="task-status-select">' + statusOptions + '</select></div>' +
            '<div class="field-group"><span class="field-label">Assignees</span><div class="assignee-row">' + assigneePills + '</div></div>' +
            fieldInputs +
            filesSection +
          '</div>' +
          (state.error ? '<div class="status-banner error" style="margin:0 22px 14px">' + esc(state.error) + '</div>' : '') +
          commentsSection +
          '<div class="modal-footer">' +
            '<div>' + (isNew ? '' : '<button type="button" class="btn btn-danger btn-sm" data-action="delete-task" ' + (state.deleting ? 'disabled' : '') + '>' + (state.deleting ? 'Deleting…' : 'Delete task') + '</button>') + '</div>' +
            '<div style="display:flex;gap:8px">' +
              '<button type="button" class="btn btn-outline btn-sm" data-action="close-modal">Cancel</button>' +
              '<button type="button" class="btn btn-primary btn-sm" data-action="save-task" ' + (state.saving ? 'disabled' : '') + '>' + (state.saving ? 'Saving…' : (isNew ? 'Create task' : 'Save changes')) + '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  /**
   * Render one custom field's input inside the task modal, dispatching on
   * the field's ClickUp type. Falls back to a plain text input for any type
   * not explicitly handled (url, email, short_text, currency, etc.) so new
   * fields added in ClickUp later still show up without a code change.
   * @param {object} field - a custom field definition from GET /list/{id}/field
   */
  function renderCustomFieldInput(field) {
    var value = state.taskDraft.customValues[field.id];
    var label = '<span class="field-label">' + esc(field.name) + '</span>';

    if (field.type === 'date') {
      return '<div class="field-group">' + label + '<input class="field-input" type="date" data-field-id="' + field.id + '" data-field-kind="date" value="' + esc(value || '') + '" /></div>';
    }
    if (field.type === 'labels') {
      var options = (field.type_config && field.type_config.options) || [];
      var toggles = options.map(function (opt) {
        var active = (value || []).indexOf(opt.id) !== -1;
        var color = hexColor(opt.color);
        var style = active
          ? 'background:' + color + ';border-color:' + color + ';color:#fff'
          : 'border-color:' + color + ';color:' + color;
        return '<button type="button" class="medium-toggle' + (active ? ' active' : '') + '" style="' + style + '" data-action="toggle-label" data-field-id="' + field.id + '" data-option-id="' + opt.id + '">' + esc(opt.label) + '</button>';
      }).join('');
      return '<div class="field-group full">' + label + '<div class="medium-toggle-group">' + toggles + '</div></div>';
    }
    if (field.type === 'drop_down') {
      var ddOptions = (field.type_config && field.type_config.options) || [];
      var opts = '<option value="">—</option>' + ddOptions.map(function (o) {
        return '<option value="' + o.orderindex + '"' + (String(value) === String(o.orderindex) ? ' selected' : '') + '>' + esc(o.name) + '</option>';
      }).join('');
      return '<div class="field-group">' + label + '<select class="field-select" data-field-id="' + field.id + '" data-field-kind="drop_down">' + opts + '</select></div>';
    }
    if (field.type === 'checkbox') {
      return '<div class="field-group">' + label + '<label class="remember-row" style="margin-top:4px"><input type="checkbox" data-field-id="' + field.id + '" data-field-kind="checkbox" ' + (value ? 'checked' : '') + ' /> Yes</label></div>';
    }
    if (field.type === 'number') {
      return '<div class="field-group">' + label + '<input class="field-input" type="number" data-field-id="' + field.id + '" data-field-kind="number" value="' + esc(value) + '" /></div>';
    }
    // Fallback: plain text (covers "text", "short_text", "url", "email", and anything unrecognized).
    return '<div class="field-group">' + label + '<input class="field-input" type="text" data-field-id="' + field.id + '" data-field-kind="text" value="' + esc(value) + '" /></div>';
  }

  // ==========================================================================
  // SAVE / DELETE / COMMENT ACTIONS
  // ==========================================================================

  /**
   * Persist the task modal's current draft to ClickUp: creates or updates the
   * task itself (name/status/assignees), then writes each custom field
   * individually. Field-level failures are logged but don't block the overall
   * save, since one bad field shouldn't lose the rest of the user's edits.
   */
  function handleSaveTask() {
    var draft = state.taskDraft;
    if (!draft.name || !draft.name.trim()) {
      state.error = 'Give this task a name first.';
      render();
      return;
    }
    state.saving = true;
    state.error = null;
    render();

    var token = state.creds.token, listId = state.creds.listId;
    var assigneeIds = Object.keys(draft.assigneeIds).filter(function (id) { return draft.assigneeIds[id]; });

    var taskPromise;
    if (draft.id === 'new') {
      taskPromise = clickup.createTask(token, listId, { name: draft.name.trim(), status: draft.status, assignees: assigneeIds })
        .then(function (created) { return created.id; });
    } else {
      var toAdd = assigneeIds.filter(function (id) { return draft.originalAssigneeIds.indexOf(id) === -1; });
      var toRemove = draft.originalAssigneeIds.filter(function (id) { return assigneeIds.indexOf(id) === -1; });
      taskPromise = clickup.updateTask(token, draft.id, {
        name: draft.name.trim(),
        status: draft.status,
        assignees: { add: toAdd, rem: toRemove },
      }).then(function () { return draft.id; });
    }

    taskPromise
      .then(function (taskId) {
        // Push each custom field's value one call at a time. ClickUp has no
        // bulk custom-field-update endpoint, so this is N+1 requests -- fine
        // at this list's expected scale (a handful of fields per task).
        var chain = Promise.resolve();
        state.fields.forEach(function (f) {
          chain = chain.then(function () {
            var val = draft.customValues[f.id];
            var payload = val;
            if (f.type === 'date') {
              payload = toClickUpDate(val);
              if (payload === null && !val) return; // nothing to set, skip the call entirely
            }
            if (f.type === 'checkbox') payload = val ? 'true' : 'false';
            if (f.type === 'drop_down' && val !== '') payload = Number(val);
            return clickup.setCustomField(token, taskId, f.id, payload)
              .catch(function (err) { console.warn('Field update failed:', f.name, err.message); });
          });
        });
        return chain;
      })
      .then(function () {
        // Reset BEFORE closing the modal: state.saving is a single shared flag
        // (not per-modal-instance), so leaving it true here would carry over
        // and permanently disable the Save button the next time any task
        // modal opens. (Caught by the automated smoke test -- see git log.)
        state.saving = false;
        closeTaskModal();
        loadAll();
      })
      .catch(function (err) {
        state.saving = false;
        state.error = err.message || 'Could not save this task.';
        render();
      });
  }

  function handleDeleteTask() {
    if (!window.confirm('Delete this task from ClickUp? This can\u2019t be undone.')) return;
    state.deleting = true;
    render();
    clickup.deleteTask(state.creds.token, state.taskDraft.id)
      .then(function () {
        // Same "reset the shared flag on the success path too" fix as
        // handleSaveTask above -- see that comment for why this matters.
        state.deleting = false;
        closeTaskModal();
        loadAll();
      })
      .catch(function (err) {
        state.deleting = false;
        state.error = err.message;
        render();
      });
  }

  function submitComment() {
    var text = (state.newCommentText || '').trim();
    if (!text || state.taskDraft.id === 'new') return;
    state.newCommentText = '';
    clickup.postComment(state.creds.token, state.taskDraft.id, text)
      .then(function () { return clickup.getComments(state.creds.token, state.taskDraft.id); })
      .then(function (comments) { state.comments = comments; render(); })
      .catch(function (err) { state.error = err.message; render(); });
  }

  // ==========================================================================
  // EVENT DELEGATION
  // All listeners are attached ONCE, directly on `root`, and dispatch based on
  // `data-action` / element id, since root.innerHTML is fully replaced on
  // every render() (so per-element listeners would be lost anyway).
  // ==========================================================================

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'connect-form') {
      var remember = document.getElementById('cf-remember').checked;
      startClickUpOAuth(CU_LIST_ID, remember); // navigates away to ClickUp -- no render() needed here
    } else if (e.target.id === 'comment-form') {
      submitComment(); // RENDER (via submitComment -> render()) -- fine, this is a discrete submit, not a keystroke
    } else if (e.target.id === 'login-form') {
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      if (email && password) handleLogin(email, password);
    } else if (e.target.id === 'invite-form') {
      submitInvite(); // reads current state.invite* fields, already kept in sync by the input/change handlers below
    } else if (e.target.id === 'client-comment-form') {
      submitClientComment();
    }
  });

  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    switch (action) {
      case 'set-view':
        state.view = el.getAttribute('data-view');
        render(); // RENDER: structural view switch
        break;
      case 'refresh':
        loadAll(); // RENDER: loadAll() re-renders when the fetch settles
        break;
      case 'disconnect':
        disconnect(); // RENDER
        break;
      case 'sign-out':
        handleLogout(); // RENDER (async, once signOut()/disconnect() resolve)
        break;
      case 'open-admin-panel':
        state.showAdminPanel = true;
        render();
        loadAdminUsers();
        break;
      case 'close-admin-panel':
        state.showAdminPanel = false;
        render();
        break;
      case 'client-refresh':
        loadClientTasks(); // RENDER (inside loadClientTasks)
        break;
      case 'client-open-task': {
        var clientTaskId = el.getAttribute('data-task-id');
        openClientTask(clientTaskId); // RENDER (inside openClientTask)
        break;
      }
      case 'client-close-task':
        closeClientTask(); // RENDER
        break;
      case 'download-file':
        downloadFile(el.getAttribute('data-file-id')); // no RENDER -- opens a new tab, doesn't change this page's state
        break;
      case 'delete-file':
        if (window.confirm('Delete this file? This cannot be undone.')) {
          deleteFile(el.getAttribute('data-file-id'), el.getAttribute('data-task-id')); // RENDER (inside deleteFile/loadTaskFiles)
        }
        break;
      case 'new-task':
        openTaskModal('new'); // RENDER
        break;
      case 'open-task': {
        var taskId = el.getAttribute('data-task-id');
        var task = state.tasks.filter(function (t) { return t.id === taskId; })[0];
        if (task) openTaskModal(task); // RENDER
        break;
      }
      case 'close-modal':
        closeTaskModal(); // RENDER
        break;
      case 'toggle-assignee': {
        var mid = el.getAttribute('data-member-id');
        state.taskDraft.assigneeIds[mid] = !state.taskDraft.assigneeIds[mid];
        render(); // RENDER: a button toggle, not a text cursor -- safe to re-render
        break;
      }
      case 'toggle-label': {
        var fid = el.getAttribute('data-field-id');
        var oid = el.getAttribute('data-option-id');
        var arr = state.taskDraft.customValues[fid] || [];
        var idx = arr.indexOf(oid);
        if (idx === -1) arr.push(oid); else arr.splice(idx, 1);
        state.taskDraft.customValues[fid] = arr;
        render(); // RENDER
        break;
      }
      case 'save-task':
        handleSaveTask();
        break;
      case 'delete-task':
        handleDeleteTask();
        break;
      case 'cal-prev':
        state.calendarCursor = new Date(state.calendarCursor.getFullYear(), state.calendarCursor.getMonth() - 1, 1);
        render();
        break;
      case 'cal-next':
        state.calendarCursor = new Date(state.calendarCursor.getFullYear(), state.calendarCursor.getMonth() + 1, 1);
        render();
        break;
      case 'cal-today':
        state.calendarCursor = (function () { var d = new Date(); d.setDate(1); return d; })();
        render();
        break;
      case 'sort-list': {
        var key = el.getAttribute('data-key');
        if (state.listSortKey === key) state.listSortDir = state.listSortDir === 'asc' ? 'desc' : 'asc';
        else { state.listSortKey = key; state.listSortDir = 'asc'; }
        render();
        break;
      }
    }

    // Clicking the dark overlay itself (not its modal-card children) closes the modal.
    if (e.target.id === 'modal-overlay') closeTaskModal();
    if (e.target.id === 'client-modal-overlay') closeClientTask();
  });

  root.addEventListener('change', function (e) {
    if (e.target.getAttribute('data-action') === 'upload-file') {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var category = e.target.getAttribute('data-category');
      var taskId = e.target.getAttribute('data-task-id');
      var accountId = e.target.getAttribute('data-account-id');
      var role = e.target.getAttribute('data-role');
      uploadFile(file, taskId, accountId, category, role === 'client'); // RENDER (inside uploadFile)
      return;
    }
    if (e.target.id === 'account-filter-select') {
      state.accountFilter = e.target.value;
      render(); // RENDER: structural (changes which tasks are shown everywhere)
      return;
    }
    if (e.target.id === 'task-status-select') {
      // NO-RENDER: captured into the draft for use at Save time; the visual
      // board grouping only needs to update after Save, not while editing.
      state.taskDraft.status = e.target.value;
      return;
    }
    if (e.target.id === 'invite-role') {
      // NO-RENDER: the account-id field's requiredness only actually matters
      // at submit time (see submitInvite()), so no need to re-render here.
      state.inviteRole = e.target.value;
      return;
    }
    var fieldId = e.target.getAttribute('data-field-id');
    if (fieldId) {
      // NO-RENDER: custom field dropdown/checkbox/date changes just update
      // the draft; see the 'input' handler below for the text/number/date
      // typing case (dates fire 'change', not 'input', in most browsers,
      // which is why date is handled in both places defensively).
      var kind = e.target.getAttribute('data-field-kind');
      if (kind === 'checkbox') state.taskDraft.customValues[fieldId] = e.target.checked;
      else state.taskDraft.customValues[fieldId] = e.target.value;
    }
  });

  root.addEventListener('input', function (e) {
    // NO-RENDER handlers: every case here only writes into `state`, never
    // calls render(), so the browser's native text-cursor position is
    // preserved while the user is actively typing.
    if (e.target.id === 'task-name-input') {
      state.taskDraft.name = e.target.value;
      return;
    }
    if (e.target.id === 'new-comment-input') {
      state.newCommentText = e.target.value;
      return;
    }
    if (e.target.id === 'login-email') { state.loginEmail = e.target.value; return; }
    if (e.target.id === 'login-password') { state.loginPassword = e.target.value; return; }
    if (e.target.id === 'invite-email') { state.inviteEmail = e.target.value; return; }
    if (e.target.id === 'invite-name') { state.inviteDisplayName = e.target.value; return; }
    if (e.target.id === 'invite-accounts') { state.inviteAccountIds = e.target.value; return; }
    if (e.target.id === 'client-comment-input') { state.clientNewCommentText = e.target.value; return; }
    var fieldId = e.target.getAttribute('data-field-id');
    if (fieldId) {
      var kind = e.target.getAttribute('data-field-kind');
      state.taskDraft.customValues[fieldId] = kind === 'number' ? e.target.value : e.target.value;
    }
  });

  // ---- Drag-and-drop (board columns) ---------------------------------------
  // dragover/drop bubble normally, so plain delegation on `root` works here
  // too, using closest('.board-column') to find the drop target regardless
  // of which child element the pointer is actually over.

  root.addEventListener('dragstart', function (e) {
    var card = e.target.closest && e.target.closest('.card[draggable]');
    if (card) e.dataTransfer.setData('text/task-id', card.getAttribute('data-task-id'));
  });

  root.addEventListener('dragover', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (col) { e.preventDefault(); col.classList.add('drag-over'); }
  });

  root.addEventListener('dragleave', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (col) col.classList.remove('drag-over');
  });

  root.addEventListener('drop', function (e) {
    var col = e.target.closest && e.target.closest('.board-column');
    if (!col) return;
    e.preventDefault();
    col.classList.remove('drag-over');
    var taskId = e.dataTransfer.getData('text/task-id');
    var statusName = col.getAttribute('data-status');
    if (taskId && statusName) moveTask(taskId, statusName); // RENDER (inside moveTask)
  });

  // ==========================================================================
  // BOOT
  // Cached ClickUp creds (if any) are loaded immediately so they're ready the
  // moment an admin/rep's profile comes back, but nothing actually renders
  // until initAuth() confirms whether anyone's logged in -- see render()'s
  // authReady gate above.
  // ==========================================================================
  state.creds = loadCreds();
  render(); // shows the splash screen while initAuth() resolves
  initAuth();

</script>
</body>
</html>
