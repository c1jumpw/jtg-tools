    return isNaN(ms) ? null : ms;
  }

  /** Human-friendly display of a 'yyyy-mm-dd' string, e.g. "Sep 8, 2026". */
  function formatDisplayDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  /** Formats a ClickUp comment's `date` (a unix-ms timestamp, as a string) into "Sep 19, 3:04 PM". */
  function formatLogTimestamp(msString) {
    var ms = Number(msString);
    if (!ms) return '';
    var d = new Date(ms);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  /** Deterministic color for a given string (e.g. a username), for avatars. */
  function colorForString(str) {
    str = str || '';
    var hash = 0;
    for (var i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
  }

  /** Up to two initials from a display name, for avatar badges. */
  function initials(name) {
    return (name || '')
      .split(' ')
      .filter(Boolean)
      .slice(0, 2)
      .map(function (w) { return w[0] ? w[0].toUpperCase() : ''; })
      .join('');
  }

  /** Ensure a ClickUp color string has its leading '#' (some responses omit it). */
  function hexColor(c) {
    if (!c) return '#8b8fa3'; // neutral gray-violet fallback when ClickUp gives no color
    return c.charAt(0) === '#' ? c : '#' + c;
  }

  /**
   * Find a custom field + its current value on a task by exact (case-
   * insensitive) field name.
   * @param {object} task - a ClickUp task object (has .custom_fields[])
   * @param {string} fieldName
   * @returns {{field: object|null, value: *}}
   */
  function getCustomFieldValue(task, fieldName) {
    var list = task.custom_fields || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].name.toLowerCase() === fieldName.toLowerCase()) {
        return { field: list[i], value: list[i].value };
      }
    }
    return { field: null, value: null };
  }

  /**
   * Resolves a task's account id, checking BOTH a plain text field and a
   * relationship (linked-task) field, since ClickUp has both named
   * "Related Account ID" on this list -- some entries only have one filled
   * in. A relationship field's value is an array of linked-task objects
   * (each with its own .id); a text field's value is a plain string. The
   * text field wins when both are present, since that's been the primary
   * mechanism so far and is less likely to be stale.
   * @param {object} task
   * @returns {string|null}
   */
  function getTaskAccountId(task) {
    var list = task.custom_fields || [];
    var textValue = null;
    var relationshipValue = null;
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      if (!f.name || f.name.toLowerCase() !== ACCOUNT_FIELD_NAME.toLowerCase()) continue;
      if (Array.isArray(f.value)) {
        // Relationship-type field: an array of linked task summary objects.
        if (relationshipValue === null && f.value.length > 0 && f.value[0] && typeof f.value[0] === 'object' && 'id' in f.value[0]) {
          relationshipValue = String(f.value[0].id);
        }
      } else if (textValue === null && f.value !== null && f.value !== undefined && f.value !== '') {
        textValue = String(f.value);
      }
    }
    return textValue !== null ? textValue : relationshipValue;
  }

  /**
   * Resolve a "labels" (multi-select) custom field's raw value (an array of
   * option ids) into the full option objects {id, label, color}, using the
   * field definition's type_config.options as the lookup table.
   * @param {object|null} field - the field definition (from GET /list/field)
   * @param {*} value - the task's stored value for that field
   * @returns {Array<object>}
   */
  function labelsForDropdownField(field, value) {
    if (!field) return [];
    var options = (field.type_config && field.type_config.options) || [];
    if (!Array.isArray(value)) return [];
    return value
      .map(function (v) {
        for (var i = 0; i < options.length; i++) {
          if (options[i].id === v) return options[i];
        }
        return null;
      })
      .filter(Boolean);
  }

  /** Resolve a ClickUp status object's color, with a neutral fallback. */
  function statusColor(status) {
    return status && status.color ? hexColor(status.color) : '#5b6670';
  }

  // ==========================================================================
  // CREDENTIAL PERSISTENCE
  // Only {token, listId} ever gets written here -- see SECURITY NOTE at top.
  // ==========================================================================

  function loadCreds() {
    try {
      var local = localStorage.getItem(STORAGE_KEY);
      if (local) return JSON.parse(local);
    } catch (e) { /* storage disabled or corrupt -- fall through */ }
    try {
      var session = sessionStorage.getItem(STORAGE_KEY);
      if (session) return JSON.parse(session);
    } catch (e) { /* ignore */ }
    return null;
  }

  function saveCreds(creds, remember) {
    var payload = JSON.stringify(creds);
    if (remember) {
      localStorage.setItem(STORAGE_KEY, payload);
      sessionStorage.removeItem(STORAGE_KEY);
    } else {
      sessionStorage.setItem(STORAGE_KEY, payload);
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  function clearCreds() {
    localStorage.removeItem(STORAGE_KEY);
    sessionStorage.removeItem(STORAGE_KEY);
  }

  // ==========================================================================
  // AUTH & ROLES
  // ----------------------------------------------------------------------------
  // Everyone logs into ContentFlow itself first (Supabase Auth, email +
  // password) -- this is separate from, and happens before, an admin/rep's
  // own ClickUp connection. Login tells the app WHO you are and WHAT ROLE you
  // have (admin / rep / client); the role then decides what happens next:
  //   - admin: sees everything, plus the Admin panel (invite users).
  //   - rep:   connects their own ClickUp account (same OAuth flow as admin),
  //            but only ever sees the account(s) assigned to them.
  //   - client: never connects to ClickUp at all. Every read/write instead
  //            goes through our backend (BACKEND_BASE), which checks this
  //            person's login + assigned account(s) before touching ClickUp
  //            with its own service-level token. See lib/clickupService.js
  //            in the contentflow-oauth backend for that side of it.
  // ==========================================================================

  /**
   * Calls one of our own backend endpoints (contentflow-oauth on Vercel),
   * attaching the current Supabase session as a Bearer token so the backend
   * can verify who's calling. Used for OAuth token exchange, the client-role
   * data proxy, and the admin panel -- never for direct ClickUp calls (those
   * still go straight to ClickUp via cuRequest()/clickup.* below).
   * @param {string} path - path relative to BACKEND_BASE, e.g. '/api/client/tasks'
   * @param {object} [options] - standard fetch() options
   */
  function backendFetch(path, options) {
    options = options || {};
    var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    var session = state.authUser && state.authUser._session;
    if (session && session.access_token) headers.Authorization = 'Bearer ' + session.access_token;
    return fetch(BACKEND_BASE + path, Object.assign({}, options, { headers: headers }))
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          if (!res.ok) throw new Error(body.error || 'Request failed (' + res.status + ').');
          return body;
        });
      });
  }

  /** Loads this user's `profiles` row and `account_access` rows via Supabase directly (RLS limits this to their own rows). */
  function fetchProfileAndAccess() {
    return supabaseClient.from('profiles').select('*').single()
      .then(function (res) {
        if (res.error) throw res.error;
        state.profile = res.data;
        return supabaseClient.from('account_access').select('clickup_account_id, clickup_list_id');
      })
      .then(function (res) {
        if (res.error) throw res.error;
        state.accountAccess = (res.data || []).map(function (r) {
          return { clickupAccountId: r.clickup_account_id, clickupListId: r.clickup_list_id };
        });
      });
  }

  /** True for a rep whose view should be limited to their assigned account(s); admins are never restricted. */
  function isAccountRestricted() {
    return !!(state.profile && state.profile.role === 'rep' && state.accountAccess.length > 0);
  }

  function allowedAccountIds() {
    return state.accountAccess.map(function (a) { return a.clickupAccountId; });
  }

  /**
   * Loads whatever data this person's role needs (client board via our
   * backend, or admin/rep's cached ClickUp list via loadAll()) -- called
   * after EITHER the boot-time session check or a live sign-in resolves the
   * profile, since a fresh login only fires onAuthStateChange while a page
   * refresh only fires the boot path. Guarded by dataLoadedForUserId so the
   * same login doesn't trigger two overlapping loads if both paths fire for
   * it (real Supabase's onAuthStateChange also fires once at registration
   * with the current session, alongside our own getSession() check).
   */
  function loadRoleData() {
    if (!state.profile) return;
    if (state.dataLoadedForUserId === state.profile.id) return;
    state.dataLoadedForUserId = state.profile.id;
    if (state.profile.role === 'client') { if (state.accountAccess.length > 0) loadClientTasks(); }
    else if (state.creds) loadAll();
  }

  /**
   * Runs once at boot: checks for an existing Supabase session, and if the
   * URL has a ClickUp OAuth ?code= on it (i.e. we just got redirected back
   * from ClickUp), exchanges it for a ClickUp access token before proceeding.
   * Either way, ends by loading this user's profile/role (if logged in) and
   * calling render().
   */
  function initAuth() {
    // A ?code= on the URL at boot means we're returning from ClickUp's
    // authorize page, not a plain page load -- in that case data loading is
    // deferred to maybeHandleOAuthCallback() itself (it calls loadAll() once
    // the token exchange succeeds), rather than firing here too.
    var returningFromOAuth = new URLSearchParams(window.location.search).has('code');

    supabaseClient.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      state.authUser = session ? Object.assign({}, session.user, { _session: session }) : null;
      var afterProfile = state.authUser ? fetchProfileAndAccess() : Promise.resolve();
      afterProfile
        .catch(function (err) { state.loginError = err.message; })
        .then(function () {
          state.authReady = true;
          render();
          if (returningFromOAuth) return maybeHandleOAuthCallback();
          loadRoleData();
        });
    });

    supabaseClient.auth.onAuthStateChange(function (_event, session) {
      state.authUser = session ? Object.assign({}, session.user, { _session: session }) : null;
      if (!state.authUser) { state.profile = null; state.accountAccess = []; render(); return; }
      fetchProfileAndAccess()
        .then(function () { render(); loadRoleData(); })
        .catch(function (err) { state.loginError = err.message; render(); });
    });
  }

  function handleLogin(email, password) {
    state.loggingIn = true;
    state.loginError = null;
    render();
    supabaseClient.auth.signInWithPassword({ email: email, password: password })
      .then(function (res) {
        if (res.error) throw res.error;
        // onAuthStateChange (registered in initAuth) picks up the new
        // session, fetches the profile, and calls loadRoleData() -- just
        // clear the form here.
        state.loginEmail = '';
        state.loginPassword = '';
        state.loggingIn = false;
      })
      .catch(function (err) {
        state.loggingIn = false;
        state.loginError = err.message || 'Could not log in.';
        render();
      });
  }

  function handleLogout() {
    supabaseClient.auth.signOut().then(function () {
      state.authUser = null;
      state.profile = null;
      state.accountAccess = [];
      state.dataLoadedForUserId = null; // so a different person logging in next reliably reloads their own data
      disconnect(); // also clears any cached ClickUp creds for admin/rep
    });
  }

  // ---- ClickUp OAuth (admin/rep only) --------------------------------------
  // sessionStorage keys used ONLY to survive the full-page navigation to
  // ClickUp's authorize page and back -- never anything more sensitive than
  // "the list id and remember-me choice this person had typed in".
  var OAUTH_PENDING_KEY = 'contentflow.oauthPending';

  function startClickUpOAuth(listId, remember) {
    sessionStorage.setItem(OAUTH_PENDING_KEY, JSON.stringify({ listId: listId, remember: remember }));
    var redirectUri = window.location.origin + window.location.pathname;
    var authorizeUrl = 'https://app.clickup.com/api?client_id=' + encodeURIComponent(CLICKUP_CLIENT_ID) +
      '&redirect_uri=' + encodeURIComponent(redirectUri);
    window.location.assign(authorizeUrl);
  }

  /** Detects a ClickUp ?code= on the URL (post-redirect) and completes the connection. */
  function maybeHandleOAuthCallback() {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (!code) return;

    // Strip ?code= from the address bar right away so a page refresh never
    // tries to reuse an already-consumed code.
    var cleanUrl = window.location.origin + window.location.pathname;
    window.history.replaceState({}, '', cleanUrl);

    var pendingRaw = sessionStorage.getItem(OAUTH_PENDING_KEY);
    sessionStorage.removeItem(OAUTH_PENDING_KEY);
    var pending = pendingRaw ? JSON.parse(pendingRaw) : { listId: '', remember: true };

    state.connecting = true;
    state.connectError = null;
    render();
    backendFetch('/api/oauth-exchange', { method: 'POST', body: JSON.stringify({ code: code }) })
      .then(function (data) {
        if (!data.access_token) throw new Error('ClickUp did not return an access token.');
        var creds = { token: data.access_token, listId: pending.listId };
        saveCreds(creds, pending.remember);
        state.creds = creds;
        state.connecting = false;
        render();
        loadAll();
      })
      .catch(function (err) {
        state.connecting = false;
        state.connectError = err.message || 'Could not complete the ClickUp connection.';
        render();
      });
  }

  // ---- Client-role data (via backend proxy, never direct to ClickUp) -------

  function loadClientTasks() {
    state.clientLoading = true;
    state.clientError = null;
    render();
    backendFetch('/api/client/tasks')
      .then(function (data) {
        state.clientTasks = data.tasks || [];
        state.clientAccountNames = data.accountNames || {};
      })
      .catch(function (err) { state.clientError = err.message; })
      .then(function () { state.clientLoading = false; render(); });
  }

  /**
   * Lets a client add their own new content idea. The account it's created
   * under is decided entirely server-side (their own assigned account) --
   * nothing here lets them pick a different one, matching the rule that
   * only admins reassign an entry's account from the web app.
   */
  function submitClientNewTask() {
    var name = (state.clientNewTaskName || '').trim();
    if (!name) { state.clientCreateError = 'Give it a name first.'; render(); return; }
    state.clientTaskCreating = true;
    state.clientCreateError = null;
    render();
    backendFetch('/api/client/tasks', { method: 'POST', body: JSON.stringify({ name: name }) })
      .then(function () {
        state.clientCreatingTask = false;
        state.clientNewTaskName = '';
        return loadClientTasks(); // also clears clientLoading/renders
      })
      .catch(function (err) { state.clientCreateError = err.message; })
      .then(function () { state.clientTaskCreating = false; render(); });
  }

  function openClientTask(taskId) {
    state.clientOpenTaskId = taskId;
    state.clientComments = [];
    state.clientCommentsLoading = true;
    state.clientLogExpanded = false;
    state.clientTaskFiles = [];
    state.clientTaskFilesError = null;
    render();
    backendFetch('/api/client/comments?taskId=' + encodeURIComponent(taskId))
      .then(function (data) { state.clientComments = data.comments || []; })
      .catch(function (err) { state.clientError = err.message; })
      .then(function () { state.clientCommentsLoading = false; render(); });
    loadClientTaskFiles(taskId);
  }

  function closeClientTask() {
    state.clientOpenTaskId = null;
    state.clientComments = [];
    render();
  }

  function submitClientComment() {
    var text = (state.clientNewCommentText || '').trim();
    var taskId = state.clientOpenTaskId;
    if (!text || !taskId) return;
    state.clientPostingComment = true;
    state.clientNewCommentText = '';
    render();
    backendFetch('/api/client/comments', { method: 'POST', body: JSON.stringify({ taskId: taskId, commentText: text }) })
      .then(function () { return backendFetch('/api/client/comments?taskId=' + encodeURIComponent(taskId)); })
      .then(function (data) { state.clientComments = data.comments || []; })
      .catch(function (err) { state.clientError = err.message; })
      .then(function () { state.clientPostingComment = false; render(); });
  }

  // ---- Admin panel (invite users, list existing users) ----------------------

  function setAccountActive(accountId, isActive) {
    backendFetch('/api/accounts', { method: 'POST', body: JSON.stringify({ action: 'setActive', accountId: accountId, isActive: isActive }) })
      .then(function () {
        if (isActive) {
          state.inactiveAccountIds = state.inactiveAccountIds.filter(function (id) { return id !== accountId; });
        } else if (state.inactiveAccountIds.indexOf(accountId) === -1) {
          state.inactiveAccountIds.push(accountId);
        }
        render();
      })
      .catch(function (err) { state.accountsError = err.message; render(); });
  }

  function loadAdminUsers() {
    state.adminUsersLoading = true;
    state.adminUsersError = null;
    render();
    backendFetch('/api/admin/list-users')
      .then(function (data) { state.adminUsers = data.users || []; })
      .catch(function (err) { state.adminUsersError = err.message; })
      .then(function () { state.adminUsersLoading = false; render(); });
  }

  function submitInvite() {
    var email = (state.inviteEmail || '').trim();
    var role = state.inviteRole;
    var displayName = (state.inviteDisplayName || '').trim();
    var accountIds = (state.inviteAccountIds || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);

    if (!email) { state.inviteError = 'Email is required.'; render(); return; }
    if (role !== 'admin' && accountIds.length === 0) { state.inviteError = 'At least one ClickUp account ID is required for reps and clients.'; render(); return; }

    state.inviting = true;
    state.inviteError = null;
    state.inviteSuccess = null;
    render();
    backendFetch('/api/admin/invite-user', {
      method: 'POST',
      body: JSON.stringify({
        email: email,
        role: role,
        displayName: displayName || null,
        accounts: accountIds.map(function (id) { return { clickupAccountId: id }; }),
      }),
    })
      .then(function () {
        state.inviteEmail = '';
        state.inviteDisplayName = '';
        state.inviteAccountIds = '';
        state.inviteSuccess = 'Invite sent to ' + email + '.';
        return loadAdminUsers();
      })
      .catch(function (err) {
        state.inviteError = err.message;
        render();
      })
      .then(function () { state.inviting = false; render(); });
  }

  // ==========================================================================
  // FILES (Supabase Storage) -- shared by admin/rep (task modal) and client
  // (task panel). Upload works the same way for both roles: ask the backend
  // for a signed upload URL + token (it checks role/account/category
  // permission first), then use OUR OWN supabaseClient to push the bytes
  // straight to Storage -- the file's content never passes through the
  // backend at all, which is what avoids Vercel's request-size limits.
  // ==========================================================================

  function loadTaskFiles(taskId) {
    state.taskFilesLoading = true;
    state.taskFilesError = null;
    render();
    backendFetch('/api/files/list?taskId=' + encodeURIComponent(taskId))
      .then(function (data) { state.taskFiles = data.files || []; })
      .catch(function (err) { state.taskFilesError = err.message; })
      .then(function () { state.taskFilesLoading = false; render(); });
  }

  function loadClientTaskFiles(taskId) {
    state.clientTaskFilesLoading = true;
    state.clientTaskFilesError = null;
    render();
    backendFetch('/api/files/list?taskId=' + encodeURIComponent(taskId))
      .then(function (data) { state.clientTaskFiles = data.files || []; })
      .catch(function (err) { state.clientTaskFilesError = err.message; })
      .then(function () { state.clientTaskFilesLoading = false; render(); });
  }

  /**
   * Uploads one file into a task's given category, then refreshes the
   * relevant file list. Shared by both roles -- isClient just decides which
   * state flags/reload function to use.
   * @param {File} file - from an <input type="file"> element
   */
  function uploadFile(file, taskId, accountId, category, isClient) {
    if (isClient) { state.clientFileUploading = true; } else { state.taskFileUploading = category; }
    render();
    backendFetch('/api/files/upload-url', {
      method: 'POST',
      body: JSON.stringify({ taskId: taskId, accountId: accountId, category: category, filename: file.name, mimeType: file.type, sizeBytes: file.size }),
    })
      .then(function (data) {
        return supabaseClient.storage.from(data.bucket).uploadToSignedUrl(data.path, data.token, file);
      })
      .then(function (uploadRes) {
        if (uploadRes.error) throw uploadRes.error;
        var logMsg = 'Uploaded "' + file.name + '" to ' + fileCategoryLabel(category) + '.';
        if (isClient) {
          loadClientTaskFiles(taskId);
          // Best-effort: the upload itself already succeeded, so a failure
          // logging it as a comment shouldn't surface as an upload error.
          backendFetch('/api/client/comments', { method: 'POST', body: JSON.stringify({ taskId: taskId, commentText: logMsg }) })
            .then(function () { return backendFetch('/api/client/comments?taskId=' + encodeURIComponent(taskId)); })
            .then(function (data) { state.clientComments = data.comments || []; render(); })
            .catch(function () {});
        } else {
          loadTaskFiles(taskId);
          clickup.postComment(state.creds.token, taskId, logMsg)
            .then(function () { return clickup.getComments(state.creds.token, taskId); })
            .then(function (comments) { state.comments = comments; render(); })
            .catch(function () {});
        }
      })
      .catch(function (err) {
        var msg = 'Upload failed: ' + (err.message || 'unknown error');
        if (isClient) state.clientTaskFilesError = msg; else state.taskFilesError = msg;
      })
      .then(function () {
        if (isClient) state.clientFileUploading = false; else state.taskFileUploading = null;
        render();
      });
  }

  /** Opens a fresh signed download URL for a file in a new tab. */
  function downloadFile(fileId) {
    backendFetch('/api/files/download-url?fileId=' + encodeURIComponent(fileId))
      .then(function (data) { window.open(data.url, '_blank'); })
      .catch(function (err) {
        state.taskFilesError = err.message;
        state.clientTaskFilesError = err.message;
        render();
      });
  }

  function deleteFile(fileId, taskId) {
    backendFetch('/api/files/delete', { method: 'POST', body: JSON.stringify({ fileId: fileId }) })
      .then(function () { loadTaskFiles(taskId); })
      .catch(function (err) { state.taskFilesError = err.message; render(); });
  }

  // ==========================================================================
  // IDEA INFRASTRUCTURE (Pillars, Idea Inbox, Rhythm)
  // ----------------------------------------------------------------------------
  // Sits BEFORE the ClickUp-backed production board, not instead of it. Raw,
  // half-formed material lives in Supabase (via /api/pillars, /api/ideas,
  // /api/rhythm) precisely because it doesn't deserve a full ClickUp task's
  // weight yet. An idea only becomes a real task once someone "promotes" it.
  //
  // All three endpoints use the exact same role/account-scoping the rest of
  // the backend already does, so this logic is IDENTICAL for admin, rep, and
  // client -- the only per-role difference is how "promote to production"
  // actually creates the ClickUp task (see convertIdea()).
  // ==========================================================================

  var RHYTHM_SOURCES = [
    { key: 'calls', label: 'Client calls & conversations' },
    { key: 'voice_notes', label: 'Voice notes to myself' },
    { key: 'writing', label: 'Writing / journaling' },
    { key: 'social', label: 'Social posts I already make' },
    { key: 'questions', label: 'Questions people keep asking me' },
  ];
  var RHYTHM_CAPACITIES = [
    { key: '15min', label: '15 minutes a week' },
    { key: '30min', label: '30 minutes a week' },
    { key: '1hr', label: '1 hour a week' },
    { key: 'contentday', label: 'One dedicated content day' },
  ];
  var RHYTHM_ROUTINES = [
    { key: 'quick_capture', label: 'Quick Capture -- jot ideas whenever, review weekly' },
    { key: 'conversation_to_content', label: 'Conversation-to-Content -- pull ideas from calls & meetings' },
    { key: 'batch_creator', label: 'Batch Creator -- one recording/writing day' },
    { key: 'daily_builder', label: 'Daily Builder -- a few minutes every day' },
  ];

  /** Which account the Idea Inbox is currently scoped to -- admin/rep use the topnav account filter (or their one assigned account); clients use their own. */
  function currentIdeasAccountId() {
    if (state.profile && state.profile.role === 'client') {
      var clientIds = Object.keys(state.clientAccountNames || {});
      if (clientIds.length) return clientIds[0];
      return (state.accountAccess[0] && state.accountAccess[0].clickupAccountId) || null;
    }
    if (state.accountFilter && state.accountFilter !== 'all') return state.accountFilter;
    if (isAccountRestricted()) {
      var repIds = allowedAccountIds();
      return repIds[0] || null;
    }
    return null; // admin viewing "All accounts" -- ideas need one account picked
  }

  function loadIdeasData(accountId) {
    if (!accountId) return;
    state.ideasAccountLoadedFor = accountId;
    state.pillarsLoading = true;
    state.ideasLoading = true;
    state.rhythmLoading = true;
    render();
    backendFetch('/api/pillars?accountId=' + encodeURIComponent(accountId))
      .then(function (data) { state.pillars = data.pillars || []; })
      .catch(function (err) { state.ideasError = err.message; })
      .then(function () { state.pillarsLoading = false; render(); });
    backendFetch('/api/ideas?accountId=' + encodeURIComponent(accountId) + '&status=inbox')
      .then(function (data) { state.ideas = data.ideas || []; })
      .catch(function (err) { state.ideasError = err.message; })
      .then(function () { state.ideasLoading = false; render(); });
    backendFetch('/api/rhythm?accountId=' + encodeURIComponent(accountId))
      .then(function (data) { state.rhythm = data.rhythm; })
      .catch(function () {})
      .then(function () { state.rhythmLoading = false; render(); });
  }

  /** Opens the rhythm/pillars setup screen, pre-filled from the existing config if there is one (so it doubles as a "Settings" screen, not just first-run onboarding). */
  function enterRhythmSetup() {
    state.rhythmDraftSource = (state.rhythm && state.rhythm.natural_source) || null;
    state.rhythmDraftCapacity = (state.rhythm && state.rhythm.weekly_capacity) || null;
    state.rhythmDraftRoutine = (state.rhythm && state.rhythm.routine_type) || null;
    state.showRhythmSetup = true;
    render();
  }

  function submitRhythm(accountId) {
    backendFetch('/api/rhythm', {
      method: 'POST',
      body: JSON.stringify({
        accountId: accountId,
        naturalSource: state.rhythmDraftSource,
        weeklyCapacity: state.rhythmDraftCapacity,
        routineType: state.rhythmDraftRoutine,
      }),
    })
      .then(function (data) { state.rhythm = data.rhythm; state.showRhythmSetup = false; render(); })
      .catch(function (err) { state.ideasError = err.message; render(); });
  }

  function submitNewPillar(accountId) {
    var name = (state.newPillarName || '').trim();
    if (!name) return;
    backendFetch('/api/pillars', { method: 'POST', body: JSON.stringify({ action: 'create', accountId: accountId, name: name }) })
      .then(function (data) { state.pillars.push(data.pillar); state.newPillarName = ''; render(); })
      .catch(function (err) { state.ideasError = err.message; render(); });
  }

  function deletePillar(id) {
    if (!window.confirm('Remove this pillar? Ideas tagged with it just become unsorted -- nothing is deleted.')) return;
    backendFetch('/api/pillars', { method: 'POST', body: JSON.stringify({ action: 'delete', id: id }) })
      .then(function () {
        state.pillars = state.pillars.filter(function (p) { return p.id !== id; });
        state.ideas.forEach(function (i) { if (i.pillar_id === id) i.pillar_id = null; });
        render();
      })
      .catch(function (err) { state.ideasError = err.message; render(); });
  }

  function submitNewIdea(accountId) {
    var title = (state.ideaDraftTitle || '').trim();
    if (!title) return;
    backendFetch('/api/ideas', {
      method: 'POST',
      body: JSON.stringify({
        action: 'create',
        accountId: accountId,
        title: title,
        bodyText: state.ideaDraftBody || null,
        pillarId: state.ideaDraftPillarId || null,
      }),
    })
      .then(function (data) {
        state.ideas.unshift(data.idea);
        state.ideaCapturing = false;
        state.ideaDraftTitle = '';
        state.ideaDraftBody = '';
        state.ideaDraftPillarId = '';
        render();
      })
      .catch(function (err) { state.ideasError = err.message; render(); });
  }

  /** Drag-and-drop re-sort: moves an idea into a different pillar column (or back to Unsorted if pillarId is null). Optimistic, with rollback on failure. */
  function moveIdeaToPillar(ideaId, pillarId) {
    var idea = state.ideas.filter(function (i) { return i.id === ideaId; })[0];
    if (!idea) return;
    var previous = idea.pillar_id;
    if (previous === pillarId) return; // dropped back where it started -- nothing to do
    idea.pillar_id = pillarId || null;
    render();
    backendFetch('/api/ideas', { method: 'POST', body: JSON.stringify({ action: 'update', id: ideaId, pillarId: pillarId || null }) })
      .catch(function (err) {
        idea.pillar_id = previous;
        state.ideasError = err.message;
        render();
      });
  }

  function archiveIdea(id) {
    backendFetch('/api/ideas', { method: 'POST', body: JSON.stringify({ action: 'archive', id: id }) })
      .then(function () { state.ideas = state.ideas.filter(function (i) { return i.id !== id; }); render(); })
      .catch(function (err) { state.ideasError = err.message; render(); });
  }

  /**
   * Promotes an idea into a real ClickUp production task. Clients have no
   * ClickUp connection of their own, so the backend creates the task
   * server-side (action "convert"); admin/rep already have their own
   * connection, so THEY create the task the normal way and just tell the
   * backend which task it became (action "markConverted").
   */
  function convertIdea(idea) {
    if (state.profile.role === 'client') {
      backendFetch('/api/ideas', { method: 'POST', body: JSON.stringify({ action: 'convert', id: idea.id }) })
        .then(function () {
          state.ideas = state.ideas.filter(function (i) { return i.id !== idea.id; });
          render();
          loadClientTasks();
        })
        .catch(function (err) { state.ideasError = err.message; render(); });
      return;
    }
    var firstStatus = state.listMeta && state.listMeta.statuses && state.listMeta.statuses[0] && state.listMeta.statuses[0].status;
    var accountTextField = state.fields.filter(function (f) { return f.name === ACCOUNT_FIELD_NAME && (f.type === 'text' || f.type === 'short_text'); })[0];
    clickup.createTask(state.creds.token, state.creds.listId, { name: idea.title, status: firstStatus, assignees: [] })
      .then(function (created) {
        // The idea already knows which account it belongs to -- carry that
        // straight onto the new task so it doesn't land with no account at
        // all (this was a real bug: the task used to be created with only
        // a name and status, never the account).
        var setAccount = accountTextField
          ? clickup.setCustomField(state.creds.token, created.id, accountTextField.id, idea.account_id).catch(function () {})
          : Promise.resolve();
        return setAccount.then(function () { return created; });
      })
      .then(function (created) {
        return backendFetch('/api/ideas', { method: 'POST', body: JSON.stringify({ action: 'markConverted', id: idea.id, convertedTaskId: created.id }) });
      })
      .then(function () {
        state.ideas = state.ideas.filter(function (i) { return i.id !== idea.id; });
        render();
        loadAll(); // refreshes state.tasks so the new task shows up immediately in Board/List/Calendar/Dashboard
      })
      .catch(function (err) { state.ideasError = err.message; render(); });
  }

  // ==========================================================================

  /**
   * Low-level call to ClickUp, relayed through our own backend
   * (/api/clickup-proxy) rather than calling api.clickup.com directly.
   *
   * WHY A PROXY: ClickUp's REST API doesn't reliably support being called
   * straight from browser JS on a different origin -- it's built for
   * server-to-server use and doesn't consistently send the CORS headers a
   * browser requires to accept the response. This was the actual root cause
   * behind a "Could not reach ClickUp" error seen in production (v1.3.0).
   * Routing through our backend sidesteps this entirely: CORS only ever
   * applies to the browser<->our-backend leg (which we control), and the
   * backend->ClickUp leg is a plain server-to-server call, immune to it.
   *
   * The function's signature and behavior are otherwise unchanged from
   * before this fix -- same params, same return shape, same thrown-Error
   * semantics for 401/other errors -- so every clickup.* wrapper below, and
   * every caller of those wrappers, needed no changes at all.
   *
   * @param {string} token - the caller's own ClickUp OAuth token (sent as-is, no "Bearer ")
   * @param {string} path - path relative to CU_BASE, e.g. '/list/123/task'
   * @param {object} [options] - standard fetch()-style options (method, body as a JSON string, ...)
   * @returns {Promise<object|null>} parsed JSON body, or null for 204 responses
   * @throws {Error} with a user-facing .message on network failure or non-2xx status
   */
  function cuRequest(token, path, options) {
    options = options || {};
    var session = state.authUser && state.authUser._session;
    var proxyHeaders = { 'Content-Type': 'application/json' };
    if (session && session.access_token) proxyHeaders.Authorization = 'Bearer ' + session.access_token;

    var parsedBody;
    if (options.body !== undefined) {
      try { parsedBody = JSON.parse(options.body); } catch (e) { parsedBody = options.body; }
    }

    return fetch(BACKEND_BASE + '/api/clickup-proxy', {
      method: 'POST',
      headers: proxyHeaders,
      body: JSON.stringify({ clickupToken: token, path: path, method: options.method || 'GET', body: parsedBody }),
    })
      .catch(function () {
        // Network-level failure reaching OUR backend (rare -- unlike the old
        // direct-to-ClickUp call, this leg is same-origin-friendly and not
        // expected to hit CORS issues).
        throw new Error('Could not reach ContentFlow\'s backend. Check your connection and try again.');
      })
      .then(function (res) {
        if (res.status === 204) return null;
        if (!res.ok) {
          if (res.status === 401) throw new Error('Your ClickUp connection was rejected. Reconnect and try again.');
          return res.json().catch(function () { return {}; }).then(function (body) {
            throw new Error('ClickUp API error (' + res.status + '): ' + (body.error || body.err || res.statusText));
          });
        }
        return res.json();
      });
  }

  // Thin, named wrappers around cuRequest() for each endpoint ContentFlow uses.
  var clickup = {
    getUser: function (token) { return cuRequest(token, '/user'); },
    getList: function (token, listId) { return cuRequest(token, '/list/' + listId); },
    getListFields: function (token, listId) {
      return cuRequest(token, '/list/' + listId + '/field').then(function (r) { return r.fields || []; });
    },
    getListMembers: function (token, listId) {
      return cuRequest(token, '/list/' + listId + '/member').then(function (r) { return r.members || []; });
    },
    getTasks: function (token, listId) {
      // include_closed=true so "Published"/"Approved"-style closed statuses
      // still show up; subtasks=false keeps this list scoped to top-level
      // content entries (mirrors the ClickUp board's own default view).
      return cuRequest(token, '/list/' + listId + '/task?include_closed=true&subtasks=false&order_by=created&reverse=true')
        .then(function (r) { return r.tasks || []; });
    },
    getAccounts: function (token) {
      // The Companies & Accounts list -- used only to resolve an MKC ID to
      // its display name; every entry here is one account/company.
      return cuRequest(token, '/list/' + CU_ACCOUNTS_LIST_ID + '/task?include_closed=true')
        .then(function (r) { return r.tasks || []; });
    },
    createTask: function (token, listId, payload) {
      return cuRequest(token, '/list/' + listId + '/task', { method: 'POST', body: JSON.stringify(payload) });
    },
    updateTask: function (token, taskId, payload) {
      return cuRequest(token, '/task/' + taskId, { method: 'PUT', body: JSON.stringify(payload) });
    },
    deleteTask: function (token, taskId) {
      return cuRequest(token, '/task/' + taskId, { method: 'DELETE' });
    },
    setCustomField: function (token, taskId, fieldId, value) {
      return cuRequest(token, '/task/' + taskId + '/field/' + fieldId, { method: 'POST', body: JSON.stringify({ value: value }) });
    },
    getComments: function (token, taskId) {
      return cuRequest(token, '/task/' + taskId + '/comment').then(function (r) { return r.comments || []; });
    },
    postComment: function (token, taskId, commentText) {
      return cuRequest(token, '/task/' + taskId + '/comment', { method: 'POST', body: JSON.stringify({ comment_text: commentText }) });
    },
  };

  // ==========================================================================
  // DATA LOADING / MUTATIONS
  // ==========================================================================

  /**
   * Validate credentials against ClickUp, cache them, and trigger the first
   * full data load. Called from the connect screen's submit handler.
   * @param {string} token
   * @param {string} listId
   * @param {boolean} remember - persist across browser restarts (localStorage)
   *   vs. this tab session only (sessionStorage)
   */
  function connect(token, listId, remember) {
    state.connecting = true;
    state.connectError = null;
    render();
    clickup.getUser(token) // cheapest possible call that proves the token works
      .then(function () {
        var creds = { token: token, listId: listId };
        saveCreds(creds, remember);
        state.creds = creds;
        state.connecting = false;
        render();
        loadAll();
      })
      .catch(function (err) {
        state.connecting = false;
        state.connectError = err.message || 'Could not connect.';
        render();
      });
  }

  /** Clear cached credentials and return to the connect screen. */
  function disconnect() {
    clearCreds();
    state.creds = null;
    state.listMeta = null;
    state.tasks = [];
    state.fields = [];
    state.members = [];
    render();
  }

  /**
   * Fetch list metadata, custom field definitions, members, and tasks in
   * parallel, then re-render. This is the single source of truth refresh --
   * called on connect, on manual refresh, and after any save/delete/move so
   * the UI always reflects ClickUp's actual current state (rather than trying
   * to keep a fully independent local cache in sync by hand).
   */
  /**
   * Resolves an account's MKC ID to its human-readable name from whichever
   * directory this role has populated (admin/rep fetch it themselves;
   * clients get it handed to them by /api/client/tasks). Falls back to the
   * raw ID if the account isn't in either directory yet (e.g. directory
   * still loading, or a stale/typo'd id) -- never shows a blank.
   */
  function accountDisplayName(id) {
    if (id === null || id === undefined || id === '') return '';
    var key = String(id);
    if (state.accountsDirectory && state.accountsDirectory[key]) return state.accountsDirectory[key];
    if (state.clientAccountNames && state.clientAccountNames[key]) return state.clientAccountNames[key];
    return key;
  }

  /** Admin/rep only: fetches the Companies & Accounts list and builds the MKC-ID -> name map. Non-fatal on failure -- callers just fall back to raw IDs. */
  function loadAccountsDirectory() {
    if (!state.creds) return Promise.resolve();
    return clickup.getAccounts(state.creds.token)
      .then(function (accountTasks) {
        var dir = {};
        accountTasks.forEach(function (t) {
          var mkcId = getCustomFieldValue(t, 'MKC ID').value;
          if (mkcId) dir[String(mkcId)] = t.name;
        });
        state.accountsDirectory = dir;
      })
      .catch(function () {
        // Leave state.accountsDirectory as-is; accountDisplayName() already
        // falls back to raw IDs, which is a fine degraded experience.
      });
  }

  /** Admin-only: which accounts are marked inactive, and who has access to each -- powers computeAccounts()'s filtering and the Accounts management screen. Silently does nothing for non-admins (the endpoint would 403 anyway). */
  function loadAccountSettings() {
    if (!state.profile || state.profile.role !== 'admin') return Promise.resolve();
    state.accountSettingsLoading = true;
    return backendFetch('/api/accounts')
      .then(function (data) {
        state.inactiveAccountIds = data.inactiveAccountIds || [];
        state.accountUsersByAccount = data.usersByAccount || {};
      })
      .catch(function () { /* non-fatal: computeAccounts() just treats everything as active */ })
      .then(function () { state.accountSettingsLoading = false; });
  }

  function loadAll() {
    if (!state.creds) return;
    state.loading = true;
    state.error = null;
    render();
    var token = state.creds.token, listId = state.creds.listId;
    Promise.all([
      clickup.getList(token, listId),
      clickup.getListFields(token, listId),
      clickup.getListMembers(token, listId),
      clickup.getTasks(token, listId),
      loadAccountsDirectory(),
      loadAccountSettings(),
    ])
      .then(function (results) {
        state.listMeta = results[0];
        state.fields = results[1];
        state.members = results[2];
        state.tasks = results[3];
      })
      .catch(function (err) {
        state.error = err.message || 'Something went wrong loading your list.';
      })
      .then(function () {
        state.loading = false;
        render();
      });
  }

  // A task moving into this status without any draft/media files yet gets a
  // soft (dismissable) warning -- never a hard block, since there are
  // legitimate reasons to skip it (a copy-only post with no media, etc.).
  var GATED_STATUS_NAME = 'For Review';
  var GATE_REQUIRED_CATEGORIES = ['copy_drafts', 'media_raw'];

  function hasReviewReadyFiles(files) {
    return files.some(function (f) { return GATE_REQUIRED_CATEGORIES.indexOf(f.category) !== -1; });
  }

  /**
   * Move a task to a new status (drag-and-drop or status dropdown).
   * Applies the change optimistically in local state for instant feedback,
   * then confirms with ClickUp; on failure, shows the error and reloads from
   * the server to undo the optimistic change.
   * @param {string} taskId
   * @param {string} statusName - must match one of state.listMeta.statuses[].status
   */
  function moveTask(taskId, statusName) {
    if (statusName === GATED_STATUS_NAME) {
      backendFetch('/api/files/list?taskId=' + encodeURIComponent(taskId))
        .then(function (data) { return hasReviewReadyFiles(data.files || []); })
        .catch(function () { return true; }) // fail-open: a check failure should never block a legitimate move
        .then(function (ready) {
          if (!ready && !window.confirm('This task has no draft or media files yet. Move to "For Review" anyway?')) return;
          reallyMoveTask(taskId, statusName);
        });
      return;
    }
    reallyMoveTask(taskId, statusName);
  }

  function reallyMoveTask(taskId, statusName) {
    var task = state.tasks.filter(function (t) { return t.id === taskId; })[0];
    var previousStatus = task ? task.status.status : null;
    if (task) task.status = Object.assign({}, task.status, { status: statusName });
    render();
    clickup.updateTask(state.creds.token, taskId, { status: statusName })
      .catch(function (err) {
        state.error = err.message;
        if (task && previousStatus) task.status = Object.assign({}, task.status, { status: previousStatus });
        render();
      });
  }

  // ==========================================================================
  // DERIVED DATA (computed fresh from state.tasks on each render -- cheap
  // enough at expected list sizes that no memoization is needed)
  // ==========================================================================

  /** Sorted list of distinct account values found across all tasks, limited to a restricted rep's assigned account(s). */
  /** Every selectable account: the full Companies & Accounts directory (minus any admin has marked inactive), restricted further for a rep to their own assigned account(s). Deliberately NOT task-derived -- a brand-new account with zero tasks yet must still be selectable. */
  function computeAccounts() {
    var all = Object.keys(state.accountsDirectory || {})
      .filter(function (id) { return (state.inactiveAccountIds || []).indexOf(id) === -1; })
      .sort(function (a, b) { return accountDisplayName(a).localeCompare(accountDisplayName(b)); });
    if (!isAccountRestricted()) return all;
    var allowed = allowedAccountIds().map(String);
    return all.filter(function (a) { return allowed.indexOf(a) !== -1; });
  }

  /** state.tasks filtered by the current account filter, and first restricted to a rep's assigned account(s) if applicable. */
  function filteredTasks() {
    var base = state.tasks;
    if (isAccountRestricted()) {
      var allowed = allowedAccountIds().map(String);
      base = base.filter(function (t) {
        return allowed.indexOf(String(getTaskAccountId(t) || '')) !== -1;
      });
    }
    if (state.accountFilter === 'all') return base;
    return base.filter(function (t) {
      return String(getTaskAccountId(t) || '') === state.accountFilter;
    });
  }

  // ---- Dashboard derived data (shared by the admin/rep and client dashboards) ----
  // The custom field ContentFlow treats as "when someone next needs to act
  // on this" for the dashboard's needs-attention list. Must match the
  // field's exact name in ClickUp (same naming convention as ACCOUNT_FIELD_NAME).
  var NEXT_ACTION_FIELD_NAME = 'Next Action Date';

  /** [{name, color, count}] grouped by each task's own status, in first-seen order. */
  function statusBreakdown(tasks) {
    var map = {};
    var order = [];
    tasks.forEach(function (t) {
      var name = t.status ? t.status.status : '(no status)';
      if (!map[name]) { map[name] = { name: name, color: t.status && t.status.color, count: 0 }; order.push(name); }
      map[name].count++;
    });
    return order.map(function (n) { return map[n]; });
  }

  /** [{name, count}] grouped by account, highest count first. */
  function accountBreakdown(tasks) {
    var map = {};
    tasks.forEach(function (t) {
      var v = getTaskAccountId(t);
      var name = v ? accountDisplayName(v) : '(no account)';
      map[name] = (map[name] || 0) + 1;
    });
    return Object.keys(map)
      .sort(function (a, b) { return map[b] - map[a]; })
      .map(function (name) { return { name: name, count: map[name] }; });
  }

  /**
   * Tasks whose Next Action Date is overdue or within the next 7 days,
   * soonest first -- the dashboard's "needs attention" list.
   * @returns {Array<{task: object, dateStr: string, overdue: boolean}>}
   */
  function needsAttention(tasks) {
    var now = new Date();
    var cutoff = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
    var out = [];
    tasks.forEach(function (t) {
      var raw = getCustomFieldValue(t, NEXT_ACTION_FIELD_NAME).value;
      var dateStr = fromClickUpDate(raw);
      if (!dateStr) return;
      var d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime()) || d > cutoff) return;
      out.push({ task: t, dateStr: dateStr, overdue: d < now });
    });
    out.sort(function (a, b) { return a.dateStr < b.dateStr ? -1 : a.dateStr > b.dateStr ? 1 : 0; });
    return out;
  }

  var STUCK_THRESHOLD_DAYS = 7;

  /** True for a status that represents "finished" work -- these are never flagged as stuck. */
  function isTerminalStatus(status) {
    if (!status) return false;
    if (status.type === 'closed' || status.type === 'done') return true;
    return String(status.status || '').toLowerCase() === 'published';
  }

  /**
   * Tasks that look stalled: no Next Action Date set (so nobody's on the
   * hook for a next step) AND no ClickUp activity in STUCK_THRESHOLD_DAYS
   * days, excluding tasks already in a terminal status. Uses date_updated
   * as a cheap proxy for "last touched" -- not perfectly precise (it also
   * bumps on unrelated edits), but avoids fetching per-task status history
   * just to render a dashboard hint.
   */
  function stuckTasks(tasks) {
    var cutoff = Date.now() - STUCK_THRESHOLD_DAYS * 24 * 60 * 60 * 1000;
    var out = [];
    tasks.forEach(function (t) {
      if (isTerminalStatus(t.status)) return;
      var nextActionRaw = getCustomFieldValue(t, NEXT_ACTION_FIELD_NAME).value;
      if (nextActionRaw !== null && nextActionRaw !== undefined && nextActionRaw !== '') return;
      var updated = Number(t.date_updated);
      if (!updated || updated >= cutoff) return;
      out.push({ task: t, daysSinceUpdate: Math.floor((Date.now() - updated) / (24 * 60 * 60 * 1000)) });
    });
    out.sort(function (a, b) { return b.daysSinceUpdate - a.daysSinceUpdate; });
    return out;
  }

  /**
   * Shared HTML for a dashboard body, given a task list and an "open task"
   * data-action name (the two dashboards differ only in how a click on a
   * needs-attention row opens the task -- admin/rep open the editable modal,
   * clients open their read-only panel).
   */
  // ---- Idea Infrastructure views (shared by admin/rep and client) ----------

  function ideasViewHtml() {
    var accountId = currentIdeasAccountId();
    if (!accountId) {
      return '<div class="empty-state"><h3>Pick an account</h3><p>Select a specific account from the filter above to see its ideas and pillars.</p></div>';
    }
    if (state.ideasAccountLoadedFor !== accountId) { loadIdeasData(accountId); }
    if (state.pillarsLoading || state.rhythmLoading) {
      return '<div class="center-loading"><div class="spinner"></div>Loading…</div>';
    }
    if (!state.rhythm && !state.showRhythmSetup) {
      return (
        '<div class="connect-card" style="max-width:520px;margin:0 auto">' +
          '<h2 class="connect-title" style="font-size:20px">Let\'s set up your idea system</h2>' +
          '<p class="connect-sub">A couple quick questions so this account never runs out of ideas to work with.</p>' +
          '<button type="button" class="btn btn-primary" data-action="start-rhythm-setup">Get started</button>' +
        '</div>'
      );
    }
    if (state.showRhythmSetup) return rhythmWizardHtml(accountId);
    return ideasInboxHtml(accountId);
  }

  function rhythmWizardHtml(accountId) {
    function optionButtons(options, field, current) {
      return options.map(function (o) {
        return '<button type="button" class="wizard-option' + (current === o.key ? ' active' : '') + '" data-action="set-rhythm-draft" data-field="' + field + '" data-value="' + o.key + '">' + esc(o.label) + '</button>';
      }).join('');
    }
    return (
      '<div class="connect-card" style="max-width:560px;margin:0 auto">' +
        '<h2 class="connect-title" style="font-size:20px">Your content rhythm</h2>' +
        '<p class="connect-sub">Where do your best ideas usually come from?</p>' +
        '<div class="wizard-options">' + optionButtons(RHYTHM_SOURCES, 'naturalSource', state.rhythmDraftSource) + '</div>' +
        '<p class="connect-sub" style="margin-top:18px">How much time can you realistically give content each week?</p>' +
        '<div class="wizard-options">' + optionButtons(RHYTHM_CAPACITIES, 'weeklyCapacity', state.rhythmDraftCapacity) + '</div>' +
        '<p class="connect-sub" style="margin-top:18px">Which routine fits best?</p>' +
        '<div class="wizard-options">' + optionButtons(RHYTHM_ROUTINES, 'routineType', state.rhythmDraftRoutine) + '</div>' +
        '<h2 class="connect-title" style="font-size:20px;margin-top:26px">Your content pillars</h2>' +
        '<p class="connect-sub">3-5 things you want to be known for. Plain language beats marketing-speak.</p>' +
        pillarManagerHtml(accountId) +
        '<button type="button" class="btn btn-primary" style="margin-top:18px" data-action="finish-rhythm-setup" data-account-id="' + esc(accountId) + '">Save and start capturing ideas</button>' +
      '</div>'
    );
  }

  function pillarManagerHtml(accountId) {
    var chips = state.pillars.map(function (p) {
      return '<div class="pillar-chip">' + esc(p.name) + '<button type="button" class="icon-btn" data-action="delete-pillar" data-id="' + p.id + '" title="Remove">✕</button></div>';
    }).join('');
    return (
      '<div class="pillar-manager">' +
        '<div class="pillar-chip-row">' + (chips || '<span class="muted" style="font-size:12.5px">No pillars yet.</span>') + '</div>' +
        '<form id="new-pillar-form" data-account-id="' + esc(accountId) + '" style="display:flex;gap:8px;margin-top:10px">' +
          '<input id="new-pillar-input" type="text" placeholder="e.g. Business systems" value="' + esc(state.newPillarName) + '" style="flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;font-size:13px" />' +
          '<button class="btn btn-outline btn-sm" type="submit">Add</button>' +
        '</form>' +
      '</div>'
    );
  }

  var CAPACITY_IDEAS_PER_WEEK = { '15min': 0.5, '30min': 1, '1hr': 2, contentday: 4 };

  /** Gives the rhythm answers ongoing purpose instead of being a one-time form: turns "6 ideas waiting" into a realistic timeframe at this account's own pace. */
  function pipelineHealthText() {
    if (!state.rhythm) return null;
    var count = state.ideas.length;
    if (count === 0) return 'Your inbox is empty -- capture something whenever a thought crosses your mind.';
    var perWeek = CAPACITY_IDEAS_PER_WEEK[state.rhythm.weekly_capacity] || 1;
    var weeks = Math.round((count / perWeek) * 10) / 10;
    return 'You have ' + count + ' idea' + (count === 1 ? '' : 's') + ' waiting -- about ' + (weeks === 1 ? '1 week' : weeks + ' weeks') + ' of material at your current pace.';
  }

  function ideasInboxHtml(accountId) {
    var pillarOptions = '<option value="">No pillar</option>' + state.pillars.map(function (p) {
      return '<option value="' + p.id + '"' + (state.ideaDraftPillarId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    }).join('');
    var captureForm = state.ideaCapturing ? (
      '<div class="file-category" style="margin-bottom:16px">' +
        '<form id="new-idea-form" data-account-id="' + esc(accountId) + '">' +
          '<input id="idea-title-input" type="text" placeholder="What\'s the idea?" value="' + esc(state.ideaDraftTitle) + '" style="width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px;margin-bottom:8px" />' +
          '<textarea id="idea-body-input" placeholder="Any more detail? (optional)" style="width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;min-height:60px;margin-bottom:8px">' + esc(state.ideaDraftBody) + '</textarea>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
            '<select id="idea-pillar-select" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font-size:13px">' + pillarOptions + '</select>' +
            '<button class="btn btn-primary btn-sm" type="submit">Save idea</button>' +
            '<button class="btn btn-outline btn-sm" type="button" data-action="cancel-new-idea">Cancel</button>' +
          '</div>' +
        '</form>' +
      '</div>'
    ) : '';

    // Pillars as columns (like the production board), plus an always-present
    // "Unsorted" catch-all -- drag a card between columns to re-tag it. This
    // is the "matching game" layout: sorting an idea is a drag, not a form.
    var columns = state.pillars.map(function (p) { return { id: p.id, name: p.name }; });
    columns.push({ id: null, name: 'Unsorted' });

    var grouped = {};
    state.ideas.forEach(function (idea) {
      var key = idea.pillar_id || '__none__';
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(idea);
    });

    var pillarBoard = '<div class="board pillar-board">' + columns.map(function (col) {
      var key = col.id || '__none__';
      var ideasInCol = grouped[key] || [];
      return (
        '<div class="board-column pillar-column" data-pillar-id="' + esc(col.id || '') + '">' +
          '<div class="board-column-header">' + esc(col.name) + ' <span class="count">' + ideasInCol.length + '</span></div>' +
          '<div class="board-column-body">' +
            (ideasInCol.length === 0
              ? '<div class="empty-state" style="padding:24px 10px;font-size:12px">Drag an idea here</div>'
              : ideasInCol.map(function (idea) {
                  return (
                    '<div class="card idea-card" draggable="true" data-idea-id="' + idea.id + '">' +
                      '<div class="card-title">' + esc(idea.title) + '</div>' +
                      (idea.body ? '<div class="idea-row-body">' + esc(idea.body) + '</div>' : '') +
                      '<div class="idea-row-actions" style="margin-top:8px">' +
                        '<button type="button" class="btn btn-outline btn-sm" data-action="convert-idea" data-id="' + idea.id + '">Promote</button>' +
                        '<button type="button" class="icon-btn" data-action="archive-idea" data-id="' + idea.id + '" title="Archive">✕</button>' +
                      '</div>' +
                    '</div>'
                  );
                }).join('')) +
          '</div>' +
        '</div>'
      );
    }).join('') + '</div>';

    var health = pipelineHealthText();

    return (
      '<div class="ideas-inbox">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px">' +
          '<h2 style="font-family:var(--font-display);font-size:18px">Idea Inbox</h2>' +
          '<div style="display:flex;gap:8px">' +
            '<button type="button" class="btn btn-outline btn-sm" data-action="start-rhythm-setup">Pillars &amp; Rhythm</button>' +
            (!state.ideaCapturing ? '<button type="button" class="btn btn-primary btn-sm" data-action="start-new-idea">+ Capture</button>' : '') +
          '</div>' +
        '</div>' +
        '<p class="connect-help" style="margin:0 0 14px">Raw material, not yet real work -- nothing here shows up on the production board until you hit "Promote." Drag a card between pillars to re-sort it.</p>' +
        (health ? '<div class="status-banner" style="margin-bottom:14px">' + esc(health) + '</div>' : '') +
        (state.ideasError ? '<div class="status-banner error">' + esc(state.ideasError) + '</div>' : '') +
        captureForm +
        pillarBoard +
      '</div>'
    );
  }

  function dashboardBodyHtml(tasks, openAction) {
    var statuses = statusBreakdown(tasks);
    var accounts = accountBreakdown(tasks);
    var attention = needsAttention(tasks);
    var stuck = stuckTasks(tasks);
    var overdueCount = attention.filter(function (a) { return a.overdue; }).length;
    var maxStatusCount = Math.max.apply(null, [1].concat(statuses.map(function (s) { return s.count; })));

    var statCards = (
      '<div class="dash-stat"><div class="dash-stat-value">' + tasks.length + '</div><div class="dash-stat-label">Total tasks</div></div>' +
      '<div class="dash-stat' + (overdueCount ? ' dash-stat-danger' : '') + '"><div class="dash-stat-value">' + overdueCount + '</div><div class="dash-stat-label">Overdue</div></div>' +
      '<div class="dash-stat"><div class="dash-stat-value">' + (attention.length - overdueCount) + '</div><div class="dash-stat-label">Due this week</div></div>' +
      '<div class="dash-stat' + (stuck.length ? ' dash-stat-warning' : '') + '"><div class="dash-stat-value">' + stuck.length + '</div><div class="dash-stat-label">Stuck</div></div>' +
      (accounts.length > 1 ? '<div class="dash-stat"><div class="dash-stat-value">' + accounts.length + '</div><div class="dash-stat-label">Accounts</div></div>' : '')
    );

    var statusRows = statuses.map(function (s) {
      var pct = Math.round((s.count / maxStatusCount) * 100);
      return (
        '<div class="dash-bar-row">' +
          '<div class="dash-bar-label"><span class="status-dot" style="background:' + esc(hexColor(s.color)) + '"></span>' + esc(s.name) + '</div>' +
          '<div class="dash-bar-track"><div class="dash-bar-fill" style="width:' + pct + '%;background:' + esc(hexColor(s.color)) + '"></div></div>' +
          '<div class="dash-bar-count">' + s.count + '</div>' +
        '</div>'
      );
    }).join('');

    var accountRows = accounts.length > 1 ? (
      '<h3>By account</h3><div class="dash-bars">' +
        accounts.map(function (a) {
          var pct = Math.round((a.count / accounts[0].count) * 100);
          return (
            '<div class="dash-bar-row">' +
              '<div class="dash-bar-label">' + esc(a.name) + '</div>' +
              '<div class="dash-bar-track"><div class="dash-bar-fill" style="width:' + pct + '%"></div></div>' +
              '<div class="dash-bar-count">' + a.count + '</div>' +
            '</div>'
          );
        }).join('') +
      '</div>'
    ) : '';

    var attentionRows = attention.length === 0
      ? '<div class="empty-state">Nothing overdue or due this week.</div>'
      : '<div class="dash-attention-list">' + attention.map(function (a) {
          return (
            '<div class="dash-attention-row' + (a.overdue ? ' overdue' : '') + '" data-action="' + openAction + '" data-task-id="' + esc(a.task.id) + '">' +
              '<span class="dash-attention-date">' + esc(formatDisplayDate(a.dateStr)) + (a.overdue ? ' (overdue)' : '') + '</span>' +
              '<span class="dash-attention-name">' + esc(a.task.name) + '</span>' +
            '</div>'
          );
        }).join('') + '</div>';

    var stuckRows = stuck.length === 0
      ? '<div class="empty-state">Nothing stalled -- every open task has a next step or recent activity.</div>'
      : '<div class="dash-attention-list">' + stuck.map(function (s) {
          return (
            '<div class="dash-attention-row stuck" data-action="' + openAction + '" data-task-id="' + esc(s.task.id) + '">' +
              '<span class="dash-attention-date">' + s.daysSinceUpdate + 'd quiet</span>' +
              '<span class="dash-attention-name">' + esc(s.task.name) + '</span>' +
            '</div>'
          );
        }).join('') + '</div>';

    return (
      '<div class="dashboard">' +
        '<div class="dash-stats">' + statCards + '</div>' +
        '<h3>By status</h3><div class="dash-bars">' + statusRows + '</div>' +
        accountRows +
        '<h3>Needs attention</h3>' + attentionRows +
        '<h3>Stuck <span class="text-faint" style="font-weight:400;font-size:12px">(no next action, no activity in ' + STUCK_THRESHOLD_DAYS + '+ days)</span></h3>' + stuckRows +
      '</div>'
    );
  }

  // ==========================================================================
  // RENDER -- top level
  // Rebuilds root.innerHTML from scratch based on current state. Auth comes
  // first: nothing else renders until we know whether someone's logged in
  // and, if so, what role they have. See the module header comment for which
  // interactions call this vs. skip it.
  // ==========================================================================

  function render() {
    if (!state.authReady) { root.innerHTML = splashHtml(); return; }
    if (!state.authUser || !state.profile) { root.innerHTML = loginScreenHtml(); return; }
    if (state.profile.role === 'client') { root.innerHTML = clientShellHtml(); return; }
    if (state.showAdminPanel && state.profile.role === 'admin') { root.innerHTML = adminShellHtml(); return; }
    root.innerHTML = state.creds ? appShellHtml() : connectScreenHtml();
  }

  function splashHtml() {
    return '<div class="center-loading" style="height:100vh"><div class="spinner"></div></div>';
  }

  // ---- Login screen (everyone starts here) ----------------------------------

  function loginScreenHtml() {
    return (
      '<div class="connect-screen"><div class="connect-card">' +
        '<div class="connect-brand">' + brandMarkSvg() +
          '<span style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink)">ContentFlow</span>' +
        '</div>' +
        '<h1 class="connect-title">Sign in</h1>' +
        '<p class="connect-sub">Use the email and password your admin set up for you.</p>' +
        '<form class="connect-form" id="login-form">' +
          '<div><label for="login-email">Email</label>' +
            '<input id="login-email" type="email" autocomplete="username" required value="' + esc(state.loginEmail) + '" /></div>' +
          '<div><label for="login-password">Password</label>' +
            '<input id="login-password" type="password" autocomplete="current-password" required /></div>' +
          (state.loginError ? '<div class="status-banner error">' + esc(state.loginError) + '</div>' : '') +
          '<button class="btn btn-primary" type="submit" style="justify-content:center" ' + (state.loggingIn ? 'disabled' : '') + '>' +
            (state.loggingIn ? 'Signing in…' : 'Sign in') +
          '</button>' +
        '</form>' +
      '</div></div>'
    );
  }

  // ---- Connect screen (admin/rep only -- their own ClickUp OAuth connection) ----

  function connectScreenHtml() {
    return (
      '<div class="connect-screen"><div class="connect-card">' +
        '<div class="connect-brand">' + brandMarkSvg() +
          '<span style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink)">ContentFlow</span>' +
        '</div>' +
        '<h1 class="connect-title">Connect your ClickUp account</h1>' +
        '<p class="connect-sub">Connect the ClickUp user or guest account that already has access to the Client Master Content Strategy Workflow list -- ContentFlow reads and writes directly to it using your own ClickUp permissions.</p>' +
        '<form class="connect-form" id="connect-form">' +
          '<label class="remember-row"><input id="cf-remember" type="checkbox" checked /> Remember on this device</label>' +
          (state.connectError ? '<div class="status-banner error">' + esc(state.connectError) + '</div>' : '') +
          '<button class="btn btn-primary" type="submit" style="justify-content:center" ' + (state.connecting ? 'disabled' : '') + '>' +
            (state.connecting ? 'Connecting…' : 'Connect with ClickUp') +
          '</button>' +
        '</form>' +
        '<p class="connect-help">You\'ll be sent to ClickUp to approve access, then brought right back here.</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out" style="margin-top:12px">Sign out of ContentFlow</button>' +
      '</div></div>'
    );
  }

  function brandMarkSvg() {
    return '<span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13 L10 7 L14 11 L20 5" stroke="#21160a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  // ---- Main app shell (topnav + view + modal) ---------------------------

  function appShellHtml() {
    var body;
    if (state.loading && !state.listMeta) {
      body = '<div class="center-loading"><div class="spinner"></div>Loading your ClickUp list…</div>';
    } else {
      var view = state.view === 'ideas' ? ideasViewHtml() : state.view === 'board' ? boardHtml() : state.view === 'list' ? listHtml() : state.view === 'dashboard' ? dashboardHtml() : calendarHtml();
      body = (state.error ? '<div class="status-banner error">' + esc(state.error) + '</div>' : '') + view;
    }
    return (
      '<div class="app-shell">' +
        topNavHtml() +
        '<main class="main">' + body + '</main>' +
        (state.openTaskId ? taskModalHtml() : '') +
      '</div>'
    );
  }

  function topNavHtml() {
    var accounts = computeAccounts();
    var tabs = ['ideas', 'dashboard', 'board', 'list', 'calendar'].map(function (v) {
      return '<button type="button" class="view-tab' + (state.view === v ? ' active' : '') + '" data-action="set-view" data-view="' + v + '">' +
        v.charAt(0).toUpperCase() + v.slice(1) + '</button>';
    }).join('');
    var accountOptions = '<option value="all">All accounts</option>' +
      accounts.map(function (a) { return '<option value="' + esc(a) + '"' + (state.accountFilter === a ? ' selected' : '') + '>' + esc(accountDisplayName(a)) + '</option>'; }).join('');
    var isAdmin = state.profile && state.profile.role === 'admin';

    return (
      '<div class="topnav">' +
        '<div class="brand">' + brandMarkSvg() + 'ContentFlow</div>' +
        '<div class="view-tabs">' + tabs + '</div>' +
        '<div class="topnav-spacer"></div>' +
        '<div class="topnav-right">' +
          (accounts.length ? '<div class="account-filter"><select id="account-filter-select">' + accountOptions + '</select></div>' : '') +
          '<button type="button" class="icon-btn" title="Refresh" data-action="refresh">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0 0 14.9 2.5M19.5 9A8 8 0 0 0 4.6 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>' +
          '<button type="button" class="btn btn-primary btn-sm" data-action="new-task">+ New</button>' +
          (isAdmin ? '<button type="button" class="btn btn-ghost btn-sm" data-action="open-admin-panel">Admin</button>' : '') +
          '<div class="settings-menu-wrap">' +
            '<button type="button" class="icon-btn" title="Settings" data-action="toggle-settings-menu">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="2"/></svg>' +
            '</button>' +
            (state.showSettingsMenu ? (
              '<div class="settings-menu">' +
                '<button type="button" class="settings-menu-item" data-action="disconnect">Disconnect ClickUp</button>' +
              '</div>'
            ) : '') +
          '</div>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out">Sign out</button>' +
        '</div>' +
      '</div>'
    );
  }

  // ---- Client-role shell (read-only: view + comment, no ClickUp connection) ----
  // Clients never get a ClickUp token -- all data here comes from our own
  // backend (state.clientTasks, loaded via loadClientTasks()/backendFetch()),
  // already filtered server-side to their own account(s). This shell is
  // intentionally separate from appShellHtml()/boardHtml()/etc above rather
  // than reusing them with a bunch of "if not readOnly" branches threaded
  // through drag-and-drop, the task modal, and custom field editing -- for a
  // view-and-comment-only surface, a smaller dedicated set of render
  // functions is easier to keep correct than retrofitting the editable ones.

  function clientTopNavHtml() {
    var tabs = ['ideas', 'dashboard', 'board', 'list'].map(function (v) {
      return '<button type="button" class="view-tab' + (state.view === v ? ' active' : '') + '" data-action="set-view" data-view="' + v + '">' +
        v.charAt(0).toUpperCase() + v.slice(1) + '</button>';
    }).join('');
    return (
      '<div class="topnav">' +
        '<div class="brand">' + brandMarkSvg() + 'ContentFlow</div>' +
        '<div class="view-tabs">' + tabs + '</div>' +
        '<div class="topnav-spacer"></div>' +
        '<div class="topnav-right">' +
          '<button type="button" class="icon-btn" title="Refresh" data-action="client-refresh">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6M4.5 15a8 8 0 0 0 14.9 2.5M19.5 9A8 8 0 0 0 4.6 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>' +
          '<button type="button" class="btn btn-primary btn-sm" data-action="client-new-task">+ New</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out">Sign out</button>' +
        '</div>' +
      '</div>'
    );
  }

  function clientCardHtml(task) {
    var acct = getTaskAccountId(task);
    var mv = getCustomFieldValue(task, 'Medium(s)');
    var mediums = labelsForDropdownField(mv.field, mv.value);
    var chips = mediums.map(function (m) {
      return '<span class="chip" style="background:' + hexColor(m.color) + '">' + esc(m.label || m.name) + '</span>';
    }).join('');
    return (
      '<div class="card" data-action="client-open-task" data-task-id="' + esc(task.id) + '">' +
        (acct ? '<div class="account-badge">' + esc(accountDisplayName(acct)) + '</div>' : '') +
        '<div class="card-title">' + esc(task.name) + '</div>' +
        (chips ? '<div class="card-meta-row">' + chips + '</div>' : '') +
      '</div>'
    );
  }

  function clientDashboardHtml() {
    return dashboardBodyHtml(state.clientTasks, 'client-open-task');
  }

  function clientBoardHtml() {
    var tasks = state.clientTasks;
    var statusesSeen = {};
    var order = [];
    tasks.forEach(function (t) {

  // ---- List (table) view --------------------------------------------------

  // Column defs for the sortable list view. `get` extracts a comparable

  var LIST_COLUMNS = [
    { key: 'name', label: 'Task', get: function (t) { return t.name || ''; } },
    { key: 'status', label: 'Status', get: function (t) { return (t.status && t.status.status) || ''; } },

    { key: 'published', label: 'Publish date', get: function (t) { return fromClickUpDate(getCustomFieldValue(t, 'Publish Date').value); } },
    { key: 'assignees', label: 'Assignees', get: function (t) { return (t.assignees || []).map(function (a) { return a.username; }).join(', '); } },

    var dir = state.listSortDir === 'desc' ? -1 : 1;
    tasks.sort(function (a, b) {
      return dir * String(sortCol.get(a)).localeCompare(String(sortCol.get(b)), undefined, { numeric: true });

    var headerCells = LIST_COLUMNS.map(function (c) {

  state.listSortKey = 'name';
